name: Apply tested Channel 24 catalog repair (one-time)
on:
  push:
    branches: [fix/channel24-verified-video]
    paths: [tools/channel24_apply_once.py, .github/workflows/channel24-apply-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: channel24-inspection
          run-id: 34730278893
          github-token: ${{ github.token }}
          path: _channel24_audit
      - uses: actions/download-artifact@v4
        with:
          name: channel24-extra-video
          run-id: 34730577734
          github-token: ${{ github.token }}
          path: _channel24_extra
      - name: Apply exact locally tested catalog bytes
        run: python3 tools/channel24_apply_once.py
      - name: Prepare site without including transient inspection data
        run: |
          rm -rf _channel24_audit _channel24_extra
          python3 tools/prepare_site.py
      - name: All original tests and added catalog regressions
        run: node --test tests/*.test.cjs
      - name: Commit only the tested catalog and its change report to the repair branch
        run: |
          test "$GITHUB_REF" = refs/heads/fix/channel24-verified-video
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/channel24-media-repair.json
          git commit -m 'Use verified H264 playback files and append the 13 Cosmos episodes'
          git push origin HEAD:refs/heads/fix/channel24-verified-video
