name: One-time single-file player rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flatten-single-file.yml"

permissions:
  contents: write

jobs:
  flatten:
    if: ${{ !contains(github.event.head_commit.message || '', '[single-file-built]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build one self-contained index.html
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const sourceFiles = [
            'catalog.js',
            'star_trek_tos_catalog.js',
            'harvest_tng.js',
            'harvest_ds9.js',
            'harvest_voyager.js',
            'harvest_star_trek_continues.js',
            'harvest_hitchcock_s1.js',
            'harvest_hitchcock_s2.js',
            'harvest_hitchcock_s3.js',
            'harvest_buck_rogers.js',
            'harvest_man_from_atlantis.js',
            'refined_catalog_utils.js',
            ...Array.from({length: 24}, (_, i) => `refined_data_${String(i + 1).padStart(2, '0')}.js`),
            'mancave_extras.js',
            'programming_registry.js',
            'v171_cleanup.js'
          ];

          for (const file of sourceFiles) {
            if (!fs.existsSync(file)) {
              throw new Error(`Required source file missing: ${file}`);
            }
          }

          const sandbox = {
            console,
            encodeURIComponent,
            decodeURIComponent,
            setTimeout,
            clearTimeout,
            window: {
              addEventListener: () => {}
            },
            document: {
              title: '',
              querySelector: () => null
            }
          };
          vm.createContext(sandbox);

          const combined = sourceFiles
            .map(file => `\n// ===== ${file} =====\n${fs.readFileSync(file, 'utf8')}`)
            .join('\n') + '\nthis.__FINAL_CATEGORIES__ = categories;\n';

          vm.runInContext(combined, sandbox, {
            filename: 'flatten-current-player.js',
            timeout: 120000
          });

          const categories = sandbox.__FINAL_CATEGORIES__;
          if (!Array.isArray(categories) || categories.length === 0) {
            throw new Error('The live channel schedule did not assemble.');
          }

          const total = categories.reduce((sum, channel) => sum + channel.content.length, 0);
          const seen = new Set();
          for (const channel of categories) {
            for (const item of channel.content) {
              if (!item || typeof item.n !== 'string' || typeof item.u !== 'string') {
                throw new Error(`Malformed entry in channel ${channel.name}`);
              }
              if (seen.has(item.u)) {
                throw new Error(`Duplicate URL remained in live schedule: ${item.u}`);
              }
              seen.add(item.u);
            }
          }

          function jsString(value) {
            return JSON.stringify(String(value))
              .replace(/<\/script/gi, '<\\/script');
          }

          let catalog = '';
          catalog += '<script>\n';
          catalog += '// ============================================================\n';
          catalog += '// CLINE CLASSIC TV — EDITABLE SINGLE-FILE PROGRAM CATALOG\n';
          catalog += '// Every live program is listed below. Add, remove, rename, or\n';
          catalog += '// move entries directly inside these channel arrays.\n';
          catalog += '// Entry format: { n: "Program title", u: "direct media URL" },\n';
          catalog += '// ============================================================\n\n';

          for (const channel of categories) {
            catalog += `// CHANNEL ${channel.name} — ${channel.label || ''}\n`;
            catalog += `const ${channel.name} = [\n`;
            for (const item of channel.content) {
              catalog += `    { n: ${jsString(item.n)}, u: ${jsString(item.u)} },\n`;
            }
            catalog += '];\n\n';
          }

          catalog += 'const categories = [\n';
          for (const channel of categories) {
            catalog += `    { name: ${jsString(channel.name)}, label: ${jsString(channel.label || '')}, kind: ${jsString(channel.kind || 'video')}, content: ${channel.name} },\n`;
          }
          catalog += '];\n';
          catalog += `<\/script>\n`;

          let html = fs.readFileSync('index.html', 'utf8');

          // Remove every external JavaScript dependency. The replacement
          // catalog below becomes the only programming source.
          html = html.replace(/\s*<script\s+src=["'][^"']+["']\s*><\/script>/gi, '');

          // Insert the explicit editable arrays before the body.
          html = html.replace('</head>', `${catalog}</head>`);

          html = html
            .replace(/CLINE CLASSIC TV \| (?:BOOMER|MAN CAVE) V\d+ \(4:3 EDITION\)/g, 'CLINE CLASSIC TV | SINGLE FILE (4:3 EDITION)')
            .replace(/V\d+-CRT\s*\/\s*(?:BOOMER EDITION|MAN CAVE|[^<\n]*)/g, 'SINGLE-FILE CRT')
            .replace(/=== V\d+ OBSERVATORY SYSTEM DIAGNOSTICS ===/g, '=== SINGLE-FILE OBSERVATORY SYSTEM DIAGNOSTICS ===');

          fs.writeFileSync('index.html', html);

          const check = fs.readFileSync('index.html', 'utf8');
          if (/<script\s+src=/i.test(check)) {
            throw new Error('External script dependency remained in index.html.');
          }
          if (!check.includes('const categories = [')) {
            throw new Error('Inline categories were not written to index.html.');
          }
          if (!check.includes('function loadAndPlay()')) {
            throw new Error('Player engine was not preserved.');
          }

          const readme = `# Cline-Tv-player-\n\nA self-contained CRT-style web player for curated Internet Archive video streams through the Imperial Physics Observatory site.\n\n## The file that runs the player\n\n**The root \`index.html\` is the complete player.** It contains the screen, green OSD, controls, static/retry behavior, every channel, and every program URL. It has no JavaScript catalog dependencies.\n\nTo edit programming, open \`index.html\` and search for:\n\n\`CLINE CLASSIC TV — EDITABLE SINGLE-FILE PROGRAM CATALOG\`\n\nEvery channel is a normal array written the long way:\n\n\`const A = [ ... ];\`\n\nEach program is one visible line:\n\n\`{ n: "Program title", u: "direct media URL" },\`\n\nAdd, remove, rename, reorder, or move those lines directly. The \`categories\` list immediately after the channel arrays determines the lower tuner order and channel labels.\n\n## Backup\n\n\`2/index.html\` is retained as the older self-contained backup supplied by Carl.\n\n## Current flattened schedule\n\nThe one-time rebuild flattened **${total.toLocaleString()} live entries across ${categories.length} channels** into the root \`index.html\`. The browser console remains the final operational check.\n\n## Repository structure\n\nThe player no longer depends on generated catalog, harvester, loader, registry, patch, or cleanup files. Those temporary architecture files were removed after their live schedule was flattened.\n`;
          fs.writeFileSync('README.md', readme);

          const removeExact = [
            'archive-browser.html',
            'BOOMER_CLEANUP_PLAN.md',
            'V170_BACKUP_MARKER.txt',
            'boomer_music_talk.js',
            'catalog.js',
            'discovered_collections.js',
            'mancave_extras.js',
            'mancave_verified_video.js',
            'programming_registry.js',
            'radio_channels.js',
            'refined_catalog_utils.js',
            'schoolhouse_rock_catalog.js',
            'star_trek_tos_catalog.js',
            'v171_cleanup.js',
            'x_minus_one_catalog.js'
          ];

          for (const file of removeExact) {
            if (fs.existsSync(file)) fs.rmSync(file, {force: true});
          }

          for (const file of fs.readdirSync('.')) {
            if (/^harvest_.*\.js$/i.test(file)) fs.rmSync(file, {force: true});
            if (/^refined_data_\d+\.js$/i.test(file)) fs.rmSync(file, {force: true});
          }

          // Remove this one-time workflow from the finished repository.
          fs.rmSync('.github/workflows/flatten-single-file.yml', {force: true});

          console.log(`Flattened ${total} entries across ${categories.length} channels into index.html.`);
          NODE

      - name: Commit the simplified repository
        shell: bash
        run: |
          git config user.name "Carl Dean Cline Sr"
          git config user.email "CARLDCLINE@GMAIL.COM"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Restore one-file editable player [single-file-built]"
          git push origin main
