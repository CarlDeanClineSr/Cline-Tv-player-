name: Deploy Cline Classic TV

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the site
        run: |
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload TV player
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy TV player
        id: deployment
        uses: actions/deploy-pages@v4
