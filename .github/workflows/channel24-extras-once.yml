name: Channel 24 additional video inspection (one-time)
on:
  push:
    branches: [fix/channel24-verified-video]
    paths: [tools/channel24_extras_once.py, .github/workflows/channel24-extras-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/channel24_extras_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel24-extra-video
          path: _channel24_extra
          retention-days: 30
