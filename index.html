<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>CLINE CLASSIC TV | MAN CAVE V164 (4:3 EDITION)</title>
  <style>
    :root{
      --bg:#0a0a0a;
      --cabinet:#0f0f0f;
      --panel1:#4d4d4d;
      --panel2:#2a2a2a;
      --trim:#111;
      --screen-border:#1c1c1c;
      --text:#e0e0e0;
      --accent:#ff7a00;
      --soft:#777;
      --btn:#181818;
      --btn-border:#444;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      color: var(--text);
    }

    #cabinet {
      width: min(96vw, 1200px);
      height: min(92vh, 900px);
      max-width: 100%;
      max-height: 100%;
      background: var(--cabinet);
      border: clamp(18px, 4vw, 28px) solid var(--bg);
      border-radius: 28px;
      box-shadow: 0 60px 100px #000, inset 0 0 140px #000;
      display: flex;
      flex-direction: column;
      padding: clamp(20px, 5vw, 50px) clamp(24px, 6vw, 80px);
      position: relative;
      overflow: hidden;
      align-items: center;
    }

    .glass-tube {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      max-height: 60vh;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: clamp(14px, 3vw, 22px) solid var(--screen-border);
      box-shadow: inset 0 0 90px #000, 0 0 50px #000;
      margin-bottom: clamp(12px, 3vw, 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .glass-tube::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.07), rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, rgba(255,255,255,.04)),
        radial-gradient(circle at 50% 8%, rgba(255,255,255,.08), transparent 30%);
      z-index: 2;
    }

    video, audio {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    audio {
      height: 60px;
      width: 90%;
      filter: invert(80%) sepia(10%) saturate(1000%) hue-rotate(180deg) brightness(80%) contrast(90%);
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
    }

    #audio-player { display: none; }

    .right-panel {
      width: 100%;
      height: auto;
      background: linear-gradient(var(--panel1), var(--panel2));
      border: clamp(10px, 2vw, 14px) solid var(--trim);
      border-radius: 10px;
      padding: clamp(12px, 3vw, 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 3vw, 18px);
      box-shadow: inset 0 0 40px #000;
    }

    .title-grille {
      width: 100%;
      height: clamp(44px, 10vw, 60px);
      background: repeating-linear-gradient(45deg, #222, #222 5px, #1a1a1a 5px, #1a1a1a 14px);
      border: 8px solid var(--trim);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 12px;
      overflow: hidden;
      position: relative;
    }

    #title-display {
      color: var(--text);
      font-size: clamp(13px, 3.2vw, 16px);
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 0 0 6px #444, 1px 1px 2px #000;
      white-space: nowrap;
      overflow: hidden;
      width: 100%;
      padding: 0 40px 0 0;
      will-change: transform;
    }

    #title-display.scroller-active {
      animation: marquee 28s linear infinite;
    }

    #title-display:hover, #title-display:active {
      animation-play-state: paused;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .dial-housing {
      position: relative;
      width: clamp(100px, 40vw, 140px);
      height: clamp(120px, 36vw, 160px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .knob {
      width: clamp(60px, 22vw, 74px);
      height: clamp(60px, 22vw, 74px);
      background: #1f1f1f;
      border: clamp(8px, 3vw, 10px) solid #0f0f0f;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 8px 20px #000;
      position: relative;
      touch-action: manipulation;
      user-select: none;
    }

    .knob::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 28px;
      background: #ddd;
      transform: translate(-50%, -50%);
      transform-origin: center top;
    }

    .number-ring {
      position: absolute;
      width: clamp(140px, 50vw, 200px);
      height: clamp(140px, 50vw, 200px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .tick {
      position: absolute;
      width: 2px;
      height: 8px;
      background: var(--soft);
      top: 50%;
      left: 50%;
      transform-origin: center center;
      opacity: 0.8;
    }

    .number {
      position: absolute;
      width: clamp(26px, 6vw, 32px);
      height: clamp(26px, 6vw, 32px);
      text-align: center;
      line-height: clamp(26px, 6vw, 32px);
      font-size: clamp(10px, 3vw, 13px);
      color: #eee;
      text-shadow: 0 0 5px #000;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .controls-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tv-btn {
      background: var(--btn);
      color: #fff;
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      padding: 10px 8px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }

    .tv-btn:active {
      transform: translateY(1px);
    }

    .volume-container {
      width: clamp(90px, 40vw, 180px);
      height: 34px;
      background: #222;
      border: 5px solid var(--trim);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px auto 0;
      padding: 0 10px;
    }

    .volume-slider {
      width: 100%;
      height: 6px;
      background: #444;
      border-radius: 3px;
      outline: none;
    }

    .fs-toggle, .version, .status-pill {
      position: absolute;
      top: clamp(15px, 4vw, 25px);
      z-index: 100;
      font-weight: bold;
      border-radius: 8px;
      font-size: clamp(9px, 2.5vw, 10px);
    }

    .fs-toggle {
      left: clamp(15px, 4vw, 25px);
      background: #111;
      color: #fff;
      border: 1px solid #444;
      padding: clamp(8px, 2vw, 10px) clamp(12px, 3vw, 16px);
      cursor: pointer;
    }

    .version {
      right: clamp(15px, 4vw, 25px);
      color: var(--accent);
    }

    .status-pill {
      top: auto;
      bottom: clamp(12px, 3vw, 18px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      border: 1px solid #444;
      padding: 8px 12px;
      color: #ddd;
      min-width: 220px;
      text-align: center;
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
    }

    .status-pill.show {
      opacity: 1;
    }

    @media (min-width: 769px) {
      body { flex-direction: row; }

      #cabinet {
        flex-direction: row;
        justify-content: center;
        align-items: center;
      }

      .glass-tube {
        width: auto;
        height: 100%;
        aspect-ratio: 4 / 3;
        max-height: 100%;
        margin-bottom: 0;
      }

      .right-panel {
        width: 24%;
        height: 100%;
        margin-left: 20px;
        justify-content: center;
      }

      .title-grille { height: 56px; }
      #title-display { font-size: 16px; }
    }
  </style>
</head>
<body>

<button class="fs-toggle" onclick="toggleFS()">[ FULL SCREEN ]</button>
<div class="version">V164 (4:3)</div>

<div id="cabinet">
  <div class="glass-tube">
    <video id="player" autoplay controls playsinline webkit-playsinline></video>
    <audio id="audio-player" controls></audio>
  </div>

  <div class="right-panel">
    <div class="title-grille">
      <div id="title-display">STANDBY</div>
    </div>

    <div class="controls-row">
      <button class="tv-btn" onclick="prevItem()">[ PREV ]</button>
      <button class="tv-btn" onclick="toggleMute()">[ MUTE ]</button>
      <button class="tv-btn" onclick="toggleShuffle()">[ SHUFFLE ]</button>
      <button class="tv-btn" onclick="nextItem()">[ NEXT ]</button>
    </div>

    <div class="dial-housing">
      <div class="number-ring" id="t-ring"></div>
      <div class="knob" id="t-knob" title="Channel tune"
           onclick="tune(1)"
           oncontextmenu="event.preventDefault(); tune(-1);"></div>
    </div>

    <div class="volume-container">
      <input type="range" min="0" max="1" step="0.01" value="0.7"
             class="volume-slider" id="volume-knob"
             oninput="changeVolume(this.value)">
    </div>

    <div class="dial-housing">
      <div class="number-ring" id="s-ring"></div>
      <div class="knob" id="s-knob" title="Category select"
           onclick="changeCategory(1)"
           oncontextmenu="event.preventDefault(); changeCategory(-1);"></div>
    </div>
  </div>
</div>

<div id="status-pill" class="status-pill"></div>

    {n: "1x29 - The City on the Edge of Forever", u: ST_BASE_URL + "1x29-TheCityOnTheEdgeOfForever.mp4"},
    {n: "1x30 - Operation Annihilate!", u: ST_BASE_URL + "1x30-OperationAnnihilate.mp4"},
    {n: "Earth Was Made: The Alps", u: EARTH_BASE_URL + "History.Ch.How.the.Earth.Was.Made.Complete.Season.1.13of13.The.Alps.XviD.AC3.MVGroup.org.mp4"},
    {n: "Project UFO S02E13", u: UFO_BASE_URL + "Project%20UFO%20S02E13%20-%20The%20Wild%20Blue%20Yonder%20Incident.mp4"}
  ];

  const categories = [
    {name: "A", content: A},
    {name: "B", content: B},
    {name: "C", content: C},
    {name: "D", content: D},
    {name: "E", content: E},
    {name: "F", content: F},
    {name: "G", content: G},
    {name: "H", content: H},
    {name: "I", content: I},
    {name: "J", content: J}
  ];

  let currentCategoryIndex = Number(localStorage.getItem("ctv_category")) || 0;
  let currentVideoIndex = Number(localStorage.getItem("ctv_video")) || 0;
  let tunerDeg = Number(localStorage.getItem("ctv_tuner_deg")) || 0;
  let categoryDeg = Number(localStorage.getItem("ctv_cat_deg")) || 0;
  let errorRetryCount = 0;
  let shuffleMode = localStorage.getItem("ctv_shuffle") === "1";
  let muted = localStorage.getItem("ctv_muted") === "1";

  const MAX_RETRIES = 4;
  const RETRY_DELAY_MS = 4000;

  const player = document.getElementById('player');
  const audioPlayer = document.getElementById('audio-player');
  const titleDisp = document.getElementById('title-display');
  const volumeKnob = document.getElementById('volume-knob');
  const statusPill = document.getElementById('status-pill');

  const savedVolume = localStorage.getItem("ctv_volume");
  volumeKnob.value = savedVolume !== null ? savedVolume : "0.7";

  function persistState() {
    localStorage.setItem("ctv_category", currentCategoryIndex);
    localStorage.setItem("ctv_video", currentVideoIndex);
    localStorage.setItem("ctv_tuner_deg", tunerDeg);
    localStorage.setItem("ctv_cat_deg", categoryDeg);
    localStorage.setItem("ctv_volume", volumeKnob.value);
    localStorage.setItem("ctv_shuffle", shuffleMode ? "1" : "0");
    localStorage.setItem("ctv_muted", muted ? "1" : "0");
  }

  function showStatus(text, timeout = 2000) {
    statusPill.textContent = text;
    statusPill.classList.add("show");
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(() => statusPill.classList.remove("show"), timeout);
  }

  function checkOverflow() {
    titleDisp.classList.remove('scroller-active');
    void titleDisp.offsetWidth;
    if (titleDisp.scrollWidth > titleDisp.clientWidth + 10) {
      titleDisp.classList.add('scroller-active');
    } else {
      titleDisp.style.transform = 'translateX(0)';
    }
  }

  function updateTitleDisplay(text) {
    titleDisp.innerText = text;
    setTimeout(checkOverflow, 60);
  }

  function makeTicks(id, count) {
    const ring = document.getElementById(id);
    ring.innerHTML = '';
    const radius = 52;
    const step = 360 / count;
    for (let i = 0; i < count; i++) {
      const angle = i * step;
      const tick = document.createElement('div');
      tick.className = 'tick';
      tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-${radius}px)`;
      ring.appendChild(tick);
    }
  }

  function makeNumbers(id, count) {
    const ring = document.getElementById(id);
    ring.innerHTML = '';
    const radius = 52;
    const step = 360 / count;
    for (let i = 0; i < count; i++) {
      const angle = i * step - 90;
      const rad = angle * Math.PI / 180;
      const x = radius * Math.cos(rad);
      const y = radius * Math.sin(rad);
      const num = document.createElement('div');
      num.className = 'number';
      num.style.left = `calc(50% + ${x}px)`;
      num.style.top = `calc(50% + ${y}px)`;
      num.innerText = i + 1;
      ring.appendChild(num);
    }
  }

  function isAudio(url) {
    const lower = url.toLowerCase();
    return lower.endsWith('.mp3') || lower.endsWith('.ogg') || lower.endsWith('.wav') || lower.endsWith('.m4a');
  }

  function getCurrentItem() {
    const cat = categories[currentCategoryIndex];
    return cat.content[currentVideoIndex % cat.content.length];
  }

  function applyVolume() {
    const val = Number(volumeKnob.value);
    player.volume = val;
    audioPlayer.volume = val;
    player.muted = muted;
    audioPlayer.muted = muted;
  }

  function setMediaVisibility(isAudioMode) {
    player.style.display = isAudioMode ? 'none' : 'block';
    audioPlayer.style.display = isAudioMode ? 'block' : 'none';
  }

  function setKnobPositions() {
    document.getElementById('t-knob').style.transform = `rotate(${tunerDeg}deg)`;
    document.getElementById('s-knob').style.transform = `rotate(${categoryDeg}deg)`;
  }

  function tryPlayActiveMedia() {
    const active = player.style.display !== 'none' ? player : audioPlayer;
    active.play().catch(() => {
      const item = getCurrentItem();
      updateTitleDisplay(item.n.trim() + ' (tap to play)        ');
    });
  }

  function loadAndPlay() {
    errorRetryCount = 0;
    const item = getCurrentItem();

    player.pause();
    audioPlayer.pause();

    const audioMode = isAudio(item.u);
    setMediaVisibility(audioMode);

    updateTitleDisplay(item.n.trim() + ' [LOADING...]        ');
    showStatus(`Loading ${categories[currentCategoryIndex].name}-${currentVideoIndex + 1}`, 1400);

    if (audioMode) {
      audioPlayer.src = item.u;
      audioPlayer.load();
    } else {
      player.src = item.u;
      player.load();
    }

    applyVolume();
    persistState();
    tryPlayActiveMedia();
  }

  function changeVolume(val) {
    applyVolume();
    persistState();
    showStatus(`Volume ${Math.round(Number(val) * 100)}%`, 1000);
  }

  function nextIndexInCategory(dir) {
    const cat = categories[currentCategoryIndex];
    if (shuffleMode && dir > 0 && cat.content.length > 1) {
      let next = currentVideoIndex;
      while (next === currentVideoIndex) {
        next = Math.floor(Math.random() * cat.content.length);
      }
      currentVideoIndex = next;
    } else {
      currentVideoIndex = (currentVideoIndex + dir + cat.content.length) % cat.content.length;
    }
  }

  function tune(dir, autoAdvance = false) {
    tunerDeg += dir * 3.6;
    const cat = categories[currentCategoryIndex];

    if (autoAdvance && dir > 0 && !shuffleMode && (currentVideoIndex + 1) >= cat.content.length) {
      changeCategory(1);
      return;
    }

    nextIndexInCategory(dir);
    setKnobPositions();
    loadAndPlay();
  }

  function nextItem() { tune(1, true); }
  function prevItem() { tune(-1, false); }

  function changeCategory(dir) {
    categoryDeg += dir * 36;
    currentCategoryIndex = (currentCategoryIndex + dir + categories.length) % categories.length;
    currentVideoIndex = 0;
    setKnobPositions();
    showStatus(`Category ${categories[currentCategoryIndex].name}`, 1200);
    loadAndPlay();
  }

  function toggleMute() {
    muted = !muted;
    applyVolume();
    persistState();
    showStatus(muted ? "Muted" : "Unmuted", 1000);
  }

  function toggleShuffle() {
    shuffleMode = !shuffleMode;
    persistState();
    showStatus(shuffleMode ? "Shuffle ON" : "Shuffle OFF", 1200);
  }

  function toggleFS() {
    const elem = document.getElementById('cabinet');
    if (!document.fullscreenElement) {
      elem.requestFullscreen?.() || elem.webkitRequestFullscreen?.() || elem.mozRequestFullScreen?.() || elem.msRequestFullscreen?.();
    } else {
      document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.mozCancelFullScreen?.() || document.msExitFullscreen?.();
    }
  }

  function setPlayingTitle() {
    const item = getCurrentItem();
    updateTitleDisplay(item.n.trim() + '          ');
  }

  function setBufferingTitle() {
    if (!titleDisp.innerText.includes("BUFFERING")) {
      const item = getCurrentItem();
      updateTitleDisplay(item.n.trim() + ' [BUFFERING...]        ');
    }
  }

  function handleArchiveError(mediaEl) {
    if (errorRetryCount < MAX_RETRIES) {
      errorRetryCount++;
      updateTitleDisplay(`WAKING SERVER... (TRY ${errorRetryCount}/${MAX_RETRIES})        `);
      showStatus(`Retry ${errorRetryCount}/${MAX_RETRIES}`, 1500);

      setTimeout(() => {
        mediaEl.load();
        mediaEl.play().catch(() => {});
      }, RETRY_DELAY_MS);
    } else {
      updateTitleDisplay("SERVER TIMEOUT - SKIPPING        ");
      showStatus("Server timeout - next item", 1800);
      setTimeout(() => tune(1, true), 1800);
    }
  }

  function attachMediaEvents(el) {
    el.addEventListener('playing', setPlayingTitle);
    el.addEventListener('waiting', setBufferingTitle);
    el.addEventListener('ended', () => tune(1, true));
    el.addEventListener('error', () => handleArchiveError(el));
  }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;

    switch (e.key) {
      case 'ArrowRight': nextItem(); break;
      case 'ArrowLeft': prevItem(); break;
      case 'ArrowUp': changeCategory(1); break;
      case 'ArrowDown': changeCategory(-1); break;
      case 'm': case 'M': toggleMute(); break;
      case 's': case 'S': toggleShuffle(); break;
      case 'f': case 'F': toggleFS(); break;
      case ' ':
        e.preventDefault();
        const active = player.style.display !== 'none' ? player : audioPlayer;
        if (active.paused) active.play().catch(() => {});
        else active.pause();
        break;
    }
  });

  window.onload = () => {
    makeTicks('t-ring', 100);
    makeNumbers('s-ring', 10);
    attachMediaEvents(player);
    attachMediaEvents(audioPlayer);
    setKnobPositions();
    applyVolume();
    loadAndPlay();
  };
</script>
</body>
</html>
