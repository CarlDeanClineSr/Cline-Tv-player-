<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>CLINE CLASSIC TV | MAN CAVE V166 (4:3 EDITION)</title>
    <style>
        body { 
            background: #0a0a0a; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Courier New', Courier, monospace;
        }
        #cabinet { 
            width: min(96vw, 1200px); 
            height: min(92vh, 900px); 
            max-width: 100%; 
            max-height: 100%; 
            background: #0f0f0f; 
            border: clamp(18px, 4vw, 28px) solid #0a0a0a;
            border-radius: 28px; 
            box-shadow: 0 60px 100px #000, inset 0 0 140px #000; 
            display: flex; 
            flex-direction: column; 
            padding: clamp(20px, 5vw, 50px) clamp(30px, 6vw, 80px); 
            position: relative; 
            overflow: hidden; 
            box-sizing: border-box;
            align-items: center;
        }
        .glass-tube { 
            width: 100%; 
            height: auto;
            aspect-ratio: 4 / 3; 
            max-height: 60vh;
            background: #000; 
            border-radius: 14px; 
            overflow: hidden; 
            border: clamp(14px, 3vw, 22px) solid #1c1c1c; 
            box-shadow: inset 0 0 90px #000, 0 0 50px #000; 
            margin-bottom: clamp(12px, 3vw, 24px);
            display: flex;
            align-items: center; 
            justify-content: center;
            position: relative;
        }

        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.1);
            border-radius: 10px;
            pointer-events: none;
            z-index: 10;
        }
        
        #static-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAAgICAoKCgwMDA4ODhAQEBISEhQUFBcXFxpaWlx+DpwAAABqElEQVQ4y+2UPQ7DMAyD3R/4/hfp27tP2r8I0qE2cICMoJ4lS2T+2C8/f172v17r12p9qVqfvNWv2vpUtf5Mtb5ZrS9R6wvV+kS1vlWtL1LrS9T6VLU+Wa0vVOsz1fpctT5TrS9R6zvV+la1vlytL1Prk9X6TrU+X61vVOub1fpKtT5XrW9U6yvV+kS1vlWtL1LrS9T6VLU+Wa0vVOsz1fpctT5TrS9R6zvV+la1vlytL1Prk9X6TrU+X61vVOub1fpKtT5XrW9U6yvV+kS1vlWtL1LrS9T6VLU+Wa0vVOsz1fpctT5TrS9R6zvV+la1vlytL1Prk9X6TrU+X61vVOub1fpKtT5XrW9U6yvV+kS1vlWtL1LrS9T6VLU+Wa0vVOsz1fpctT5TrS9R6zvV+la1vlytL1Prk9X6TrU+X61vVOub1fpKtT5XrW9U6yvV+kS1vlWtL1LrS9T6VLU+Wa0vVOsz1fpctT5TrS9R6zvV+la1vlytL1Prk9X6TrU+X61vVOub1fpKtf4B0gG9f19hP4kAAAAASUVORK5CYII=');
            background-repeat: repeat;
            opacity: 0;
            z-index: 5;
            pointer-events: none;
            animation: static-flicker 0.1s infinite;
        }
        
        #static-overlay.active {
            opacity: 1;
        }

        @keyframes static-flicker {
            0% { background-position: 0px 0px; }
            20% { background-position: -50px 20px; }
            40% { background-position: 100px -40px; }
            60% { background-position: -20px 80px; }
            80% { background-position: 60px 10px; }
            100% { background-position: 0px -50px; }
        }

        video, audio { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background: #000; 
            transition: opacity 0.1s;
        }
        audio {
            height: 60px;
            width: 90%;
            filter: invert(80%) sepia(10%) saturate(1000%) hue-rotate(180deg) brightness(80%) contrast(90%);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }
        #audio-player {
            display: none;
        }
        .right-panel { 
            width: 100%; 
            height: auto; 
            background: linear-gradient(#4d4d4d, #2a2a2a); 
            border: clamp(10px, 2vw, 14px) solid #111; 
            border-radius: 10px; 
            padding: clamp(12px, 3vw, 20px); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: clamp(14px, 3.5vw, 30px); 
            box-shadow: inset 0 0 40px #000; 
            box-sizing: border-box;
        }
        .title-grille { 
            width: 100%; 
            height: clamp(44px, 10vw, 60px); 
            background: repeating-linear-gradient(45deg, #222, #222 5px, #1a1a1a 5px, #1a1a1a 14px); 
            border: 8px solid #111; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start; 
            padding: 0 12px; 
            box-sizing: border-box; 
            overflow: hidden;
            position: relative;
        }
        #title-display {
            color: #e0e0e0;
            font-size: clamp(13px, 3.2vw, 16px);
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 6px #444, 1px 1px 2px #000;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            padding: 0 40px 0 0;
            box-sizing: border-box;
            will-change: transform;
        }
        #title-display.scroller-active {
            animation: marquee 32s linear infinite;
        }
        #title-display:hover, #title-display:active {
            animation-play-state: paused;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        .dial-housing { 
            position: relative; 
            width: clamp(120px, 45vw, 180px); 
            height: clamp(140px, 45vw, 200px); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            margin-bottom: 20px;
        }
        .knob { 
            width: clamp(60px, 22vw, 84px); 
            height: clamp(60px, 22vw, 84px); 
            background: #1f1f1f; 
            border: clamp(8px, 3vw, 12px) solid #0f0f0f; 
            border-radius: 50%; 
            cursor: pointer; 
            box-shadow: 0 8px 20px #000; 
            position: relative; 
            touch-action: manipulation;
        }
        .knob::after { 
            content: ''; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 4px; 
            height: 32px; 
            background: #ddd; 
            transform: translate(-50%, -50%); 
            transform-origin: center top;
        }
        .number-ring { 
            position: absolute; 
            width: clamp(160px, 55vw, 240px); 
            height: clamp(160px, 55vw, 240px); 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none; 
        }
        .tick {
            position: absolute;
            width: 2px;
            height: 8px;
            background: #777;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            opacity: 0.8;
        }
        .number { 
            position: absolute; 
            width: clamp(26px, 6vw, 32px); 
            height: clamp(26px, 6vw, 32px); 
            text-align: center; 
            line-height: clamp(26px, 6vw, 32px); 
            font-size: clamp(12px, 3vw, 15px); 
            font-weight: bold;
            color: #eee; 
            text-shadow: 0 0 5px #000; 
            transform: translate(-50%, -50%); 
            pointer-events: none; 
        }
        .volume-container { 
            width: clamp(90px, 30vw, 120px); 
            height: 36px; 
            background: #222; 
            border: 6px solid #111; 
            border-radius: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto;
        }
        .volume-slider { 
            width: clamp(70px, 25vw, 90px); 
            height: 6px; 
            background: #444; 
            border-radius: 3px; 
            outline: none; 
        }
        .volume-slider::-webkit-slider-thumb { 
            width: 24px; 
            height: 24px; 
            background: #ccc; 
            border-radius: 50%; 
            border: 4px solid #111; 
        }
        .fs-toggle { 
            position: absolute; 
            top: clamp(15px, 4vw, 25px); 
            left: clamp(15px, 4vw, 25px); 
            background: #111; 
            color: #fff; 
            border: 1px solid #444; 
            padding: clamp(8px, 2vw, 10px) clamp(12px, 3vw, 16px); 
            cursor: pointer; 
            font-size: clamp(9px, 2.5vw, 10px); 
            z-index: 100; 
            font-weight: bold; 
            border-radius: 8px; 
        }
        .version { 
            position: absolute; 
            top: clamp(15px, 4vw, 25px); 
            right: clamp(15px, 4vw, 25px); 
            color: #ff6600; 
            font-size: clamp(9px, 2.5vw, 10px); 
            font-weight: bold; 
        }

        @media (min-width: 769px) {
            body { flex-direction: row; }
            #cabinet { 
                flex-direction: row; 
                padding: 50px 80px; 
                justify-content: center;
                align-items: center;
            }
            .glass-tube { 
                width: auto; 
                height: 100%; 
                aspect-ratio: 4 / 3; 
                max-height: 100%;
                margin-bottom: 0;
            }
            .right-panel { 
                width: 24%; 
                height: 100%; 
                margin-left: 20px;
                justify-content: space-evenly;
            }
            .title-grille {
                height: 56px;
            }
            #title-display {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<button class="fs-toggle" onclick="toggleFS()">[ FULL SCREEN ]</button>
<div class="version">V166 (4:3 CRT)</div>

<div id="cabinet">
    <div class="glass-tube">
        <div id="static-overlay"></div>
        <div id="crt-overlay"></div>
        <video id="player" autoplay controls playsinline webkit-playsinline></video>
        <audio id="audio-player" controls></audio>
    </div>

    <div class="right-panel">
        <div class="title-grille">
            <div id="title-display">STANDBY</div>
        </div>

        <div class="dial-housing">
            <div class="number-ring" id="t-ring"></div>
            <!-- Click to go forward, Right-click to go backward -->
            <div class="knob" id="t-knob" onclick="tune(1)" oncontextmenu="event.preventDefault(); tune(-1);"></div>
        </div>

        <div class="volume-container">
            <input type="range" min="0" max="1" step="0.01" value="0.7" class="volume-slider" id="volume-knob" oninput="changeVolume(this.value)">
        </div>
    </div>
</div>

<script>
    const ST_BASE_URL = "https://archive.org/download/JimmyAndTheFederationGang/";
    const EARTH_BASE_URL = "https://dn710903.ca.archive.org/0/items/How.The.Earth.Was.Made/Season%201/";
    const UFO_BASE_URL = "https://dn711408.ca.archive.org/0/items/project-ufo-complete-series-1978/";

    const A = [
        {n: "In Search of... Martians", u: "https://dn711005.ca.archive.org/0/items/InSearchOf16mm/In Search of... Martians %28480p_30fps_H264-128kbit_AAC%29.mp4"},
        {n: "1x01 - The Cage", u: ST_BASE_URL + "1x01-TheCage.mp4"},
        {n: "1x02 - Where No Man Has Gone Before", u: ST_BASE_URL + "1x02-WhereNoManHasGoneBefore.mp4"},
        {n: "1x03 - The Corbomite Maneuver", u: ST_BASE_URL + "1x03-TheCorbomiteManeuver.mp4"}
    ];

    const B = [
        {n: "In Search of... A Call From Space", u: "https://dn711005.ca.archive.org/0/items/InSearchOf16mm/In%20Search%20of...A%20Call%20From%20Space%20%28480p_30fps_H264-128kbit_AAC%29.mp4"},
        {n: "1x04 - Mudd's Women", u: ST_BASE_URL + "1x04-MuddsWomen.mp4"},
        {n: "1x05 - The Enemy Within", u: ST_BASE_URL + "1x05-TheEnemyWithin.mp4"}
    ];

    const C = [
        {n: "In Search of... Amelia Earhart", u: "https://dn711005.ca.archive.org/0/items/InSearchOf16mm/In%20Search%20of...Amelia%20Earhart%20%28480p_30fps_H264-128kbit_AAC%29.mp4"},
        {n: "1x07 - The Naked Time", u: ST_BASE_URL + "1x07-TheNakedTime.mp4"}
    ];

    // Combine all arrays into one array-of-arrays
    const allCategories = [A, B, C]; // Add D, E, F, G, H, I, J here when you paste in your full lists

    // INTERLEAVE ALGORITHM:
    // This loops through taking item 0 from every category, then item 1 from every category.
    // It creates a perfect "mixed format" channel surfing experience.
    const masterPlaylist = [];
    const maxEpisodes = Math.max(...allCategories.map(cat => cat.length));

    for (let i = 0; i < maxEpisodes; i++) {
        for (let cat of allCategories) {
            if (cat[i]) {
                masterPlaylist.push(cat[i]);
            }
        }
    }

    let currentVideoIndex = 0;
    let tunerDeg = 0;

    let errorRetryCount = 0;
    const MAX_RETRIES = 4;

    const player = document.getElementById('player');
    const audioPlayer = document.getElementById('audio-player');
    const titleDisp = document.getElementById('title-display');
    const volumeKnob = document.getElementById('volume-knob');

    // --- V165 AUDIO CONTEXT SYNTHESIZER (Maintained for V166) ---
    let audioCtx;
    function playStaticSound() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const bufferSize = audioCtx.sampleRate * 0.35; // 350ms of static
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 2500;

        const volume = audioCtx.createGain();
        volume.gain.value = volumeKnob.value * 0.2; 

        noise.connect(filter);
        filter.connect(volume);
        volume.connect(audioCtx.destination);
        
        noise.start();
    }

    function triggerStaticDelay(actionCallback) {
        player.pause();
        audioPlayer.pause();
        player.style.opacity = '0'; 
        audioPlayer.style.opacity = '0';
        
        document.getElementById('static-overlay').classList.add('active');
        playStaticSound();

        setTimeout(() => {
            document.getElementById('static-overlay').classList.remove('active');
            player.style.opacity = '1';
            audioPlayer.style.opacity = '1';
            actionCallback();
        }, 350); 
    }

    function checkOverflow() {
        titleDisp.classList.remove('scroller-active');
        void titleDisp.offsetWidth; 
        if (titleDisp.scrollWidth > titleDisp.clientWidth + 10) {
            titleDisp.classList.add('scroller-active');
        } else {
            titleDisp.style.transform = 'translateX(0)';
        }
    }

    function updateTitleDisplay(text) {
        titleDisp.innerText = text;
        setTimeout(checkOverflow, 100);
    }

    // Merged ticks and numbers for the single dial
    function makeTicksAndNumbers(id, tickCount, numCount) {
        const ring = document.getElementById(id);
        ring.innerHTML = '';
        const radius = 62; // Pushed out slightly for the larger single dial

        // Draw the 100 fine-tuning ticks
        const tickStep = 360 / tickCount;
        for (let i = 0; i < tickCount; i++) {
            const angle = i * tickStep;
            const tick = document.createElement('div');
            tick.className = 'tick';
            tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-${radius}px)`;
            ring.appendChild(tick);
        }

        // Draw the main channel numbers (e.g., 2 through 13 for classic VHF)
        const numStep = 360 / numCount;
        for (let i = 0; i < numCount; i++) {
            const angle = i * numStep - 90;
            const rad = angle * Math.PI / 180;
            // Push the numbers just slightly outside the ticks
            const x = (radius + 20) * Math.cos(rad);
            const y = (radius + 20) * Math.sin(rad);
            const num = document.createElement('div');
            num.className = 'number';
            num.style.left = `calc(50% + ${x}px)`;
            num.style.top = `calc(50% + ${y}px)`;
            num.style.transform = `translate(-50%, -50%)`;
            num.innerText = i + 2; // Channels 2-13
            ring.appendChild(num);
        }
    }

    function isAudio(url) {
        return url.toLowerCase().endsWith('.mp3') || url.toLowerCase().endsWith('.ogg') || url.toLowerCase().endsWith('.wav');
    }

    function loadAndPlay() {
        errorRetryCount = 0;
        
        // Grab the interleaved item
        const item = masterPlaylist[currentVideoIndex];
        
        player.pause();
        audioPlayer.pause();
        
        player.style.display = 'none';
        audioPlayer.style.display = 'none';
        
        updateTitleDisplay(item.n.trim() + ' [LOADING...]        ');

        if (isAudio(item.u)) {
            audioPlayer.style.display = 'block';
            audioPlayer.src = item.u;
            audioPlayer.load();
            audioPlayer.volume = volumeKnob.value;
            audioPlayer.play().catch(err => {
                console.log("Audio play blocked:", err);
                updateTitleDisplay(item.n.trim() + ' (tap to play)        ');
            });
        } else {
            player.style.display = 'block';
            player.src = item.u;
            player.load();
            player.volume = volumeKnob.value;
            player.play().catch(err => {
                console.log("Video play blocked:", err);
                updateTitleDisplay(item.n.trim() + ' (tap to play)        ');
            });
        }
    }

    function changeVolume(val) {
        player.volume = val;
        audioPlayer.volume = val;
    }

    function tune(dir, autoAdvance = false) {
        // Rotate the single knob
        tunerDeg += dir * 10; // Steeper click angle now that we only have one knob
        document.getElementById('t-knob').style.transform = `rotate(${tunerDeg}deg)`;
        
        // Move through the interleaved master playlist
        currentVideoIndex = (currentVideoIndex + dir + masterPlaylist.length) % masterPlaylist.length;
        
        triggerStaticDelay(() => {
            loadAndPlay();
        });
    }

    function toggleFS() {
        const elem = document.getElementById('cabinet');
        if (!document.fullscreenElement) {
            elem.requestFullscreen?.() || elem.webkitRequestFullscreen?.() || elem.mozRequestFullScreen?.() || elem.msRequestFullscreen?.();
        } else {
            document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.mozCancelFullScreen?.() || document.msExitFullscreen?.();
        }
    }

    window.onload = () => {
        // Build the single unified dial (100 ticks, 12 channel numbers)
        makeTicksAndNumbers('t-ring', 100, 12);
        loadAndPlay();
    };

    function setPlayingTitle() {
        const item = masterPlaylist[currentVideoIndex];
        updateTitleDisplay(item.n.trim() + '          ');
    }

    function setBufferingTitle() {
        if(!titleDisp.innerText.includes("BUFFERING")) {
            const item = masterPlaylist[currentVideoIndex];
            updateTitleDisplay(item.n.trim() + ' [BUFFERING...]        ');
        }
    }

    player.addEventListener('playing', setPlayingTitle);
    audioPlayer.addEventListener('playing', setPlayingTitle);
    player.addEventListener('waiting', setBufferingTitle);
    audioPlayer.addEventListener('waiting', setBufferingTitle);
    
    // Auto-advance
    player.addEventListener('ended', () => tune(1, true));
    audioPlayer.addEventListener('ended', () => tune(1, true));

    function handleArchiveError(playerElement) {
        if (errorRetryCount < MAX_RETRIES) {
            errorRetryCount++;
            updateTitleDisplay(`WAKING SERVER... (Try ${errorRetryCount}/${MAX_RETRIES})        `);
            
            setTimeout(() => {
                playerElement.load();
                playerElement.play().catch(e => console.log("Retry blocked:", e));
            }, 4000); 
            
        } else {
            updateTitleDisplay("SERVER TIMEOUT - SKIPPING        ");
            setTimeout(() => tune(1, true), 2000);
        }
    }

    player.addEventListener('error', () => handleArchiveError(player));
    audioPlayer.addEventListener('error', () => handleArchiveError(audioPlayer));
</script>
</body>
</html>
