<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Archive Science TV</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Courier New", Courier, monospace;
        }

        /* The Dark Wood Cabinet */
        .tv-cabinet {
            background: linear-gradient(135deg, #3E2723 0%, #261612 100%);
            border: 15px solid #1f110c;
            border-radius: 30px;
            padding: 40px;
            display: flex;
            gap: 30px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
            width: 900px;
            align-items: center;
        }

        /* The Screen Area */
        .screen-bezel {
            background: #111;
            padding: 30px;
            border-radius: 40px;
            border: 4px solid #2a2a2a;
            box-shadow: inset 0 0 20px #000;
            position: relative;
            flex-grow: 1;
        }

        .screen-container {
            position: relative;
            width: 100%;
            padding-bottom: 75%; /* 4:3 Aspect Ratio */
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Green Glass & Scanline Overlays */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 255, 40, 0.08); /* Green Tint */
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9); /* Tube vignette */
            pointer-events: none;
            z-index: 10;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 2px,
                rgba(0,0,0,0.1) 3px,
                rgba(0,0,0,0.1) 4px
            );
            pointer-events: none;
            z-index: 11;
        }

        /* Static effect during load */
        .static-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-radial-gradient(circle at 17% 32%, white, black 0.00085px);
            animation: staticAnim 0.2s steps(2) infinite;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.1s;
        }

        .static-screen.active {
            opacity: 0.8;
        }

        @keyframes staticAnim {
            0% { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }

        iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
            z-index: 1;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 40px;
            background: #2a2a2a;
            padding: 30px 20px;
            border-radius: 10px;
            border-left: 5px solid #111;
            border-bottom: 5px solid #111;
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.1);
            align-items: center;
        }

        .knob-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .knob-label {
            color: #ccc;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .knob {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 50% 50%, #555, #111);
            border-radius: 50%;
            border: 2px solid #000;
            box-shadow: 0 5px 10px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.2);
            position: relative;
            cursor: pointer;
            transition: transform 0.1s ease-out;
        }

        .knob:active {
            box-shadow: 0 2px 5px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.2);
        }

        .knob-tick {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 15px;
            background: #fff;
            border-radius: 3px;
        }

        .knob-small {
            width: 50px;
            height: 50px;
        }

        /* Display for current status */
        .status-display {
            background: #0a0a0a;
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            border: 2px inset #333;
            width: 100%;
            box-sizing: border-box;
            text-shadow: 0 0 5px #0f0;
        }

    </style>
</head>
<body>

    <div class="tv-cabinet">
        <div class="screen-bezel">
            <div class="screen-container">
                <div class="crt-overlay"></div>
                <div class="scanlines"></div>
                <div id="static" class="static-screen"></div>
                <iframe id="ia-player" src="" allowfullscreen></iframe>
            </div>
        </div>

        <div class="control-panel">
            <div class="status-display" id="status-screen">
                BAND: 50s<br>CH: 01
            </div>

            <div class="knob-wrapper">
                <div class="knob" id="knob-band" onclick="changeBand()">
                    <div class="knob-tick"></div>
                </div>
                <div class="knob-label">Decade</div>
            </div>

            <div class="knob-wrapper">
                <div class="knob" id="knob-channel" onclick="changeChannel()">
                    <div class="knob-tick"></div>
                </div>
                <div class="knob-label">Channel</div>
            </div>

            <div class="knob-wrapper">
                <div class="knob knob-small" id="knob-volume" onclick="turnVolume()">
                    <div class="knob-tick"></div>
                </div>
                <div class="knob-label">Volume</div>
            </div>
        </div>
    </div>

    <script>
        // Internet Archive Identifiers for classic science/space documentaries
        const programming = {
            "50s": [
                "A_is_for_Atom_1953", // Classic atomic energy doc
                "The_Bell_Laboratory_Science_Series_The_Unchained_Goddess_1958", // Weather
                "Our_Mr_Sun_1956", // Sun/Solar science
                "Destination_Earth_1956" // Space/Oil industry future doc
            ],
            "60s": [
                "ComputerGlossary1968", // 1968 Computer Science
                "gov.archives.arc.1155023", // Apollo 11 moon mission film
                "The_Flight_of_Apollo_11", // Space race
                "1960s_NASA_JPL_Explorer" // Early satellite science
            ],
            "70s": [
                "WhosOutThere", // 1975 NASA doc on Extraterrestrial life by Orson Welles
                "SkylabTheFirst40Days", // 1974 NASA Skylab mission
                "Mars_The_Search_Begins_1974", // JPL Mars Exploration
                "Powers_of_Ten_1977" // Famous scale of the universe film
            ]
        };

        const bands = ["50s", "60s", "70s"];
        let currentBandIndex = 0;
        let currentChannelIndex = 0;

        // Knob rotation states
        let bandRot = 0;
        let channelRot = 0;
        let volumeRot = 0;

        const iaPlayer = document.getElementById('ia-player');
        const staticScreen = document.getElementById('static');
        const statusScreen = document.getElementById('status-screen');

        // Initial Load
        loadVideo();

        function playClickSound() {
            // Using Web Audio API for a quick mechanical click synthesis
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.05);
        }

        function triggerStatic() {
            staticScreen.classList.add('active');
            // Give IA servers 1.5 seconds to load up before removing static
            setTimeout(() => {
                staticScreen.classList.remove('active');
            }, 1500);
        }

        function loadVideo() {
            triggerStatic();
            const currentBand = bands[currentBandIndex];
            const videoId = programming[currentBand][currentChannelIndex];
            
            // Build the IA embed URL
            // Using autoplay=1 (browser permitting) and hiding some IA UI elements
            const url = `https://archive.org/embed/${videoId}?autoplay=1&ui=false`;
            iaPlayer.src = url;

            // Update green LCD status text
            statusScreen.innerHTML = `BAND: ${currentBand}<br>CH: 0${currentChannelIndex + 1}`;
        }

        function changeBand() {
            playClickSound();
            currentBandIndex = (currentBandIndex + 1) % bands.length;
            currentChannelIndex = 0; // Reset channel when changing bands
            
            // Rotate knob 120 degrees
            bandRot += 120;
            document.getElementById('knob-band').style.transform = `rotate(${bandRot}deg)`;
            
            loadVideo();
        }

        function changeChannel() {
            playClickSound();
            const currentBand = bands[currentBandIndex];
            currentChannelIndex = (currentChannelIndex + 1) % programming[currentBand].length;
            
            // Rotate knob 45 degrees per channel click
            channelRot += 45;
            document.getElementById('knob-channel').style.transform = `rotate(${channelRot}deg)`;
            
            loadVideo();
        }

        function turnVolume() {
            playClickSound();
            volumeRot += 30;
            document.getElementById('knob-volume').style.transform = `rotate(${volumeRot}deg)`;
            // Note: Actual iframe volume is sandboxed by cross-origin policies. 
            // The user must adjust volume inside the video player directly.
        }
    </script>
</body>
</html>
