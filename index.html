// CH 1: STAR TREK & CLOSE ENCOUNTERS

// Short display labels only: original catalog titles and media URLs stay intact.

        .replace(/\[(?:\d{3,4}p|HD|SD|BluRay|WEB-DL|x264|x265)\]/gi,'')

}

function nextSelection(){return currentVideoIndex+1<categories[currentCategoryIndex].content.length?[currentCategoryIndex,currentVideoIndex+1]:[(currentCategoryIndex+1)%categories.length,0];}

const PICTURE_GRACE_SECONDS=5, PICTURE_POLL_MS=500;
function stopPictureCheck(s){

function confirmPicture(s){

function watchPictureFrame(s){
    if(!active(s)||s.audioMode||s.pictureSeen||s.rejecting||s.frameRequest!=null)return;
    if(typeof s.media.requestVideoFrameCallback!=='function')return;
    try{
        s.frameApi=true;
        s.frameRequest=s.media.requestVideoFrameCallback((_now,frame)=>{
            s.frameRequest=null;
            if(!active(s)||s.rejecting)return;

            else watchPictureFrame(s);

    }catch{s.frameApi=false;}
}
function skipNoPicture(s){

    s.media.pause();stopAudioScope();

    if(failedSelections.size>=total){
        setStatus('No playable picture found. Choose a program or press Retry.');
        document.getElementById('retry-play').hidden=false;return;
    }
    setStatus('No video picture — skipping this TV entry.');

function checkPicture(s){

    clearTimeout(s.pictureTimer);s.pictureTimer=null;
    const media=s.media,dimensions=media.videoWidth>0&&media.videoHeight>0;
    let frameCountsAvailable=false;

        try{
            const q=media.getVideoPlaybackQuality();
            frameCountsAvailable=Number.isFinite(q.totalVideoFrames)&&Number.isFinite(q.droppedVideoFrames);
            if(frameCountsAvailable&&q.totalVideoFrames>q.droppedVideoFrames){confirmPicture(s);return;}
        }catch{/* Fall back only when a frame counter is unavailable. */}
    }
    if(dimensions&&!s.frameApi&&!frameCountsAvailable&&media.readyState>=2){confirmPicture(s);return;}
    const now=performance.now(),position=validTime(media.currentTime);
    const advancing=s.isPlaying&&!media.paused&&!media.ended&&!media.seeking&&!document.hidden&&media.readyState>=2;

    if(s.isPlaying)s.pictureTimer=setTimeout(()=>checkPicture(s),PICTURE_POLL_MS);
}
function loadAndPlay(time=0,retries=0){

function armWatchdog(s){clearTimeout(s.watchdog);s.watchdog=setTimeout(()=>{if(active(s)&&!s.media.paused)handleArchiveError(s);},30000);}
function attemptPlay(s){

function handleArchiveError(s){

function resumeCurrent(){if(active())attemptPlay(session);else retryCurrent();}

function enableKnobSwipe(knob,turn){
    let start=null,suppressClick=false;
    knob.style.touchAction='none';
    knob.addEventListener('pointerdown',e=>{
        if(e.pointerType==='mouse')return;
        start={id:e.pointerId,x:e.clientX,y:e.clientY};suppressClick=false;
        if(knob.setPointerCapture)knob.setPointerCapture(e.pointerId);
    });
    knob.addEventListener('pointerup',e=>{
        if(!start||e.pointerId!==start.id)return;
        const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;
        if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
        suppressClick=true;e.preventDefault();turn(Math.abs(dy)>=Math.abs(dx)?(dy<0?1:-1):(dx>0?1:-1));
    });
    knob.addEventListener('pointercancel',()=>{start=null;suppressClick=false;});
    knob.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false;}},true);

function changeVolume(v){v=Math.min(1,Math.max(0,Number(v)));if(!Number.isFinite(v))return;preferences.volume=v;preferences.muted=false;volumeKnob.value=String(v);if(active()){session.media.volume=v;session.media.muted=false;}persist();}
function toggleFavorite(){const c=categories[currentCategoryIndex].name;preferences.favorites=preferences.favorites.includes(c)?preferences.favorites.filter(x=>x!==c):[...preferences.favorites,c];persist();updateNow();}
function openGuide(){renderGuide();document.getElementById('guide').showModal();document.getElementById('guide-search').focus();}
const GUIDE_BATCH=100;
let guideMatches=[],guideShown=0;
function renderGuide(){

let playerOrientationLocked=false;
function releasePlayerOrientation(){

async function requestLandscape(){

        if(!document.fullscreenElement&&!player.webkitDisplayingFullscreen)releasePlayerOrientation();

document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)releasePlayerOrientation();});

        if(player.webkitDisplayingFullscreen&&player.webkitExitFullscreen){player.webkitExitFullscreen();releasePlayerOrientation();return;}
        const phone=!!window.matchMedia?.('(pointer: coarse)').matches && !!window.matchMedia?.('(max-width: 900px), (max-height: 600px)').matches;

        if(phone&&videoMode&&player.webkitEnterFullscreen){player.webkitEnterFullscreen();void requestLandscape();return;}
        const target=phone&&videoMode?player:document.getElementById('cabinet');

function playClickSound() {
    if(!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if(!AudioContext) return;
        audioCtx = new AudioContext();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(Number(volumeKnob.value) * 0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

function playStaticSound() {
    if(!audioCtx) return;
    const n = audioCtx.sampleRate * 0.35;
    const b = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0; i<n; i++) d[i] = Math.random() * 2 - 1;
    const s = audioCtx.createBufferSource();
    const f = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = 2500;
    g.gain.value = Number(volumeKnob.value) * 0.2;
    s.connect(f); f.connect(g); g.connect(audioCtx.destination);
    s.start();
}

function makeTicks(id, count) {
    const r = document.getElementById(id);
    r.innerHTML = '';
    const step = 360 / count;
    for(let i=0; i<count; i++){
        const t = document.createElement('div');
        t.className = 'tick';
        t.style.transform = `translate(-50%,-50%) rotate(${i*step}deg) translateY(calc(-1 * var(--tick-radius,60px)))`;
        r.appendChild(t);
    }
}

const AUDIO_EXTENSIONS = ['.mp3','.m4a','.aac','.ogg','.oga','.wav','.flac','.opus'];
function isAudio(url) {
    const p = String(url).split(/[?#]/,1)[0].toLowerCase();
    return AUDIO_EXTENSIONS.some(x => p.endsWith(x));
}

function seededRandom(seed){let v=seed>>>0;return()=>{v=(1664525*v+1013904223)>>>0;return v/4294967296}}

function buildRadioStars(title){const rnd=seededRandom(hashText(title||'CLINE RADIO'));radioStars=[];for(let i=0;i<90;i++)radioStars.push({x:rnd(),y:rnd(),size:.45+rnd()*1.6,phase:rnd()*Math.PI*2,drift:.25+rnd()*.75})}
function resizeAudioScope(){const r=audioScope.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.floor(r.width*d)),h=Math.max(1,Math.floor(r.height*d));if(audioScope.width!==w||audioScope.height!==h){audioScope.width=w;audioScope.height=h}return{width:w,height:h,dpr:d}}
function drawAudioScope(){if(!audioStage.classList.contains('active')){audioScopeFrame=null;return}const c=audioScope.getContext('2d'),{width:w,height:h,dpr:d}=resizeAudioScope(),t=Number.isFinite(audioPlayer.currentTime)?audioPlayer.currentTime:0,m=(!audioPlayer.paused&&!audioPlayer.ended)?1:.08,now=performance.now()/1000;c.clearRect(0,0,w,h);for(const s of radioStars){const tw=.32+.68*Math.abs(Math.sin(now*s.drift+s.phase));c.beginPath();c.fillStyle=`rgba(170,255,220,${.15+tw*.55})`;c.arc(s.x*w,((s.y+now*s.drift*.0015)%1)*h,s.size*d,0,Math.PI*2);c.fill()}const cx=w/2,cy=h*.5,span=w*.37,bars=48,bw=Math.max(1.2*d,span/bars*.55);c.strokeStyle='rgba(0,255,120,.20)';c.lineWidth=Math.max(1,d);c.beginPath();c.moveTo(cx-span,cy);c.lineTo(cx+span,cy);c.stroke();for(let i=0;i<bars;i++){const q=i/(bars-1),voice=Math.abs(Math.sin(t*6.2+i*.73))*.46+Math.abs(Math.sin(t*2.3+i*.31))*.29+Math.abs(Math.sin(t*11.7+i*1.07))*.25,env=.4+.6*Math.abs(Math.sin(t*.91+i*.04)),edge=Math.pow(Math.sin(q*Math.PI),.42),amp=h*.22*edge*(.1+m*voice*env),x=(i+.5)*(span/bars),a=.3+.6*edge;c.fillStyle=`rgba(0,255,120,${a})`;c.fillRect(cx+x,cy-amp,bw,amp*2);c.fillRect(cx-x-bw,cy-amp,bw,amp*2)}const p=(.5+.5*Math.sin(t*3.4))*m;c.strokeStyle=`rgba(0,255,150,${.22+p*.42})`;c.lineWidth=Math.max(1.2*d,2);c.beginPath();c.arc(cx,cy,(24+p*34)*d,0,Math.PI*2);c.stroke();audioScopeFrame=requestAnimationFrame(drawAudioScope)}
function startAudioScope(item){buildRadioStars(item.n);audioStage.classList.add('active');if(audioScopeFrame===null)audioScopeFrame=requestAnimationFrame(drawAudioScope)}
function stopAudioScope(){audioStage.classList.remove('active');if(audioScopeFrame!==null){cancelAnimationFrame(audioScopeFrame);audioScopeFrame=null}}

window.addEventListener('resize',()=>{if(audioStage.classList.contains('active'))resizeAudioScope()});


window.addEventListener('pagehide',savePosition);
document.addEventListener('visibilitychange',()=>{if(document.hidden)savePosition();});
window.addEventListener('hashchange',()=>{const p=parseSelection(location.hash);if(p)choose(p.ci,p.vi,{time:p.time,delay:false});else if(p===false)setStatus('That shared program is not in this catalog. Open Guide to choose one.');});
window.onload=()=>{
    makeTicks('t-ring',100);makeTicks('s-ring',categories.length);
    enableKnobSwipe(document.getElementById('t-knob'),tune);enableKnobSwipe(document.getElementById('s-knob'),changeCategory);
    const volume=preferences.volume;volumeKnob.value=String(typeof volume==='number'&&Number.isFinite(volume)&&volume>=0&&volume<=1?volume:0.7);
    categories.forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=`CH ${c.name} · ${c.label}`;document.getElementById('guide-channel').appendChild(o);});
    const p=parseSelection(location.hash);
    if(p)choose(p.ci,p.vi,{time:p.time,delay:false});
    else {const ci=Math.max(0,categories.findIndex(c=>c.name===preferences.lastChannel)),saved=savedChannel(categories[ci]);choose(ci,Math.max(0,programIds[ci].indexOf(saved.id)),{delay:false});if(p===false)setStatus('Shared program not found. Open Guide to choose one.');}
};

</script>
