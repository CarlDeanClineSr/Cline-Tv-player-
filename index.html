<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>CLINE CLASSIC TV // STELLAR NAVIGATOR V165</title>
    <style>
        body { 
            background: #0a0a0a; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Courier New', Courier, monospace;
        }
        #cabinet { 
            width: min(96vw, 1200px); 
            height: min(92vh, 900px); 
            background: #0f0f0f; 
            border: clamp(18px, 4vw, 28px) solid #0a0a0a;
            border-radius: 28px; 
            box-shadow: 0 60px 100px #000, inset 0 0 140px #000; 
            display: flex; 
            flex-direction: column; 
            padding: clamp(20px, 5vw, 50px) clamp(30px, 6vw, 80px); 
            position: relative; 
            box-sizing: border-box;
            align-items: center;
        }
        .glass-tube { 
            width: 100%; 
            height: auto;
            aspect-ratio: 4 / 3; 
            max-height: 60vh;
            background: #000; 
            border-radius: 14px; 
            overflow-y: auto; 
            border: clamp(14px, 3vw, 22px) solid #1c1c1c; 
            box-shadow: inset 0 0 90px #000, 0 0 50px #000; 
            margin-bottom: clamp(12px, 3vw, 24px);
            padding: 20px;
            box-sizing: border-box;
            color: #00ff66;
        }
        .right-panel { 
            width: 100%; 
            background: linear-gradient(#4d4d4d, #2a2a2a); 
            border: clamp(10px, 2vw, 14px) solid #111; 
            border-radius: 10px; 
            padding: clamp(12px, 3vw, 20px); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            box-shadow: inset 0 0 40px #000; 
            box-sizing: border-box;
        }
        .title-grille { 
            width: 100%; 
            height: 45px; 
            background: repeating-linear-gradient(45deg, #222, #222 5px, #1a1a1a 5px, #1a1a1a 14px); 
            border: 4px solid #111; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 10px; 
            box-sizing: border-box;
        }
        #title-display {
            color: #ff6600;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 6px #000;
        }
        .input-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        input[type="number"] {
            background: #000;
            border: 2px solid #333;
            color: #00ff66;
            padding: 8px;
            font-size: 16px;
            font-family: monospace;
            width: 140px;
            text-align: center;
            border-radius: 4px;
            outline: none;
        }
        button {
            background: #ff6600;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #ff8833; }
        .data-row {
            margin: 8px 0;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #111;
            padding-bottom: 3px;
        }
        .data-label { color: #777; }
        .data-value { color: #00ff66; font-weight: bold; }
        .external-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #3399ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .external-link:hover { text-decoration: underline; }
        .version { 
            position: absolute; 
            top: 20px; 
            right: 25px; 
            color: #ff6600; 
            font-size: 10px; 
            font-weight: bold; 
        }
        @media (min-width: 769px) {
            body { flex-direction: row; }
            #cabinet { flex-direction: row; padding: 40px; justify-content: center; align-items: center; }
            .glass-tube { width: 70%; height: 100%; max-height: 100%; margin-bottom: 0; }
            .right-panel { width: 28%; height: 100%; margin-left: 20px; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="version">V165 // STELLAR NAV</div>

<div id="cabinet">
    <!-- CRT SCREEN / TELEMETRY DISPLAY -->
    <div class="glass-tube" id="telemetryScreen">
        <div style="color: #666; text-align: center; margin-top: 40px;">
            INITIATING SCAN TUBE...<br>CONNECTING TO NODES.JSON CACHE...
        </div>
    </div>

    <!-- CONTROL CONSOLE -->
    <div class="right-panel">
        <div class="title-grille">
            <div id="title-display">NAVIGATOR READY</div>
        </div>

        <div class="input-row">
            <input type="number" id="nodeInput" placeholder="NODE ID (1-100k)" min="1" max="100000" onkeydown="if(event.key==='Enter') lookupNode()">
            <button onclick="lookupNode()">LOCK</button>
        </div>

        <div style="color: #ccc; font-size: 11px; text-align: center; line-height: 1.4;">
            Type index ID and hit LOCK for instant vector telemetry and Stellarium visual bridge.
        </div>
    </div>
</div>

<script>
    let globalRegistry = {};
    const screen = document.getElementById('telemetryScreen');
    const titleDisp = document.getElementById('title-display');

    // Fetch the 100,000 node database live from repo deployment
    fetch('nodes.json')
        .then(response => {
            if (!response.ok) throw new Error("Database load failed");
            return response.json();
        })
        .then(data => {
            globalRegistry = data;
            titleDisp.innerText = "ONLINE // 100K NODES";
            screen.innerHTML = `<div style="color: #00ff66; text-align: center; margin-top: 40px;">SYSTEM MOUNTED.<br>100,000 EMPIRICAL NODES LOADED.<br><br>ENTER A SEQUENCE ID TO BEGIN NAVIGATION.</div>`;
        })
        .catch(err => {
            titleDisp.innerText = "LOAD ERROR";
            screen.innerHTML = `<div style="color: #ff3333; text-align: center; margin-top: 40px;">FAILED TO LOAD NODES.JSON DATABASE.</div>`;
        });

    function lookupNode() {
        const val = document.getElementById('nodeInput').value.trim();
        
        if (Object.keys(globalRegistry).length === 0) {
            screen.innerHTML = `<div style="color: #ffcc00; text-align: center; margin-top: 40px;">DATABASE STILL MOUNTING... STAND BY.</div>`;
            return;
        }

        const node = globalRegistry[val];
        
        if (!node) {
            screen.innerHTML = `<div style="color: #ff3333; text-align: center; margin-top: 40px;">TARGET #${val} NOT FOUND IN REGISTRY RANGE.</div>`;
            titleDisp.innerText = "TARGET LOST";
            return;
        }

        titleDisp.innerText = `LOCKED: ${node.id}`;
        screen.innerHTML = `
            <div style="color: #ff6600; font-weight: bold; margin-bottom: 15px; border-bottom: 1px dashed #333; padding-bottom: 5px;">
                TARGET LOCK ACQUIRED // INDEX #${val}
            </div>
            <div class="data-row"><span class="data-label">TARGET ID:</span> <span class="data-value">${node.id}</span></div>
            <div class="data-row"><span class="data-label">SHELL TIER:</span> <span class="data-value">TIER ${node.tier}</span></div>
            <div class="data-row"><span class="data-label">DISTANCE (PC):</span> <span class="data-value">${node.dist_pc} pc</span></div>
            <div class="data-row"><span class="data-label">DISTANCE (LY):</span> <span class="data-value">${node.dist_ly} ly</span></div>
            <div class="data-row"><span class="data-label">RIGHT ASCENSION:</span> <span class="data-value">${node.ra}°</span></div>
            <div class="data-row"><span class="data-label">DECLINATION:</span> <span class="data-value">${node.dec}°</span></div>
            <div class="data-row"><span class="data-label">MAGNITUDE:</span> <span class="data-value">${node.mag}</span></div>
            <div class="data-row"><span class="data-label">HARMONIC SIG:</span> <span class="data-value">${node.harmonic}</span></div>
            <a class="external-link" href="${node.visual_url}" target="_blank">[ LAUNCH VISUAL DEEP-LINK IN STELLARIUM ]</a>
        `;
    }
</script>

</body>
</html>
