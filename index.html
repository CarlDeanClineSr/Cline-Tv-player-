<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>ASSNA // STELLAR NAVIGATOR V171</title>
    
    <!-- Aladin Lite v3 CSS -->
    <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css" />
    
    <style>
        :root { --crt-green: #00ff66; --panel-bg: #111; }
        body { 
            background: #0a0a0a; margin: 0; padding: 0; overflow: hidden; 
            height: 100vh; width: 100vw; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Courier New', Courier, monospace;
        }
        
        :fullscreen { background: #000; }
        :fullscreen #cabinet { width: 100vw; height: 100vh; border-radius: 0; border: none; padding: 20px; }
        
        #cabinet { 
            width: min(98vw, 1300px); height: min(95vh, 920px); 
            background: #0f0f0f; border: clamp(14px, 3vw, 24px) solid #0a0a0a;
            border-radius: 28px; box-shadow: 0 60px 100px #000, inset 0 0 140px #000; 
            display: flex; flex-direction: column; 
            padding: clamp(15px, 3vw, 30px) clamp(20px, 4vw, 50px); 
            box-sizing: border-box; align-items: center; transition: all 0.3s ease;
        }
        
        .main-stage {
            display: flex; width: 100%; height: 100%; gap: 20px; box-sizing: border-box;
        }

        .glass-tube { 
            flex: 2.5; background: #000; border-radius: 12px; overflow: hidden; 
            border: clamp(10px, 2vw, 16px) solid #1c1c1c; 
            box-shadow: inset 0 0 60px #000, 0 0 40px #000; 
            position: relative; box-sizing: border-box;
        }
        
        #aladin-lite-div { width: 100%; height: 100%; }
        
        /* THE NEW CRT SCANLINE OVERLAY */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none; /* Lets you click through it to the map */
            z-index: 5;
        }
        
        .side-panel { 
            flex: 1; background: linear-gradient(#3a3a3a, #1f1f1f); 
            border: clamp(8px, 2vw, 12px) solid var(--panel-bg); 
            border-radius: 10px; padding: 15px; display: flex; flex-direction: column; 
            align-items: center; gap: 12px; box-shadow: inset 0 0 30px #000; 
            box-sizing: border-box;
        }

        .title-grille { 
            width: 100%; height: 40px; 
            background: repeating-linear-gradient(45deg, #222, #222 5px, #1a1a1a 5px, #1a1a1a 14px); 
            border: 3px solid var(--panel-bg); border-radius: 6px; 
            display: flex; align-items: center; justify-content: center;
        }
        #title-display { color: #ff6600; font-size: 13px; font-weight: bold; text-shadow: 0 0 6px #000; }
        
        .input-row { display: flex; gap: 5px; width: 100%; justify-content: center; }
        input[type="number"] {
            background: #000; border: 2px solid #333; color: var(--crt-green); padding: 8px 4px; 
            font-size: 15px; font-family: monospace; width: 90px; text-align: center; outline: none;
        }
        button {
            background: #ff6600; color: #000; border: none; padding: 8px 10px; 
            font-weight: bold; font-family: monospace; cursor: pointer; border-radius: 4px;
        }
        button:hover { background: #ff8833; }
        .sweep-btn { background: #444; color: #00ff66; border: 1px solid #00ff66; }
        .sweep-btn:hover { background: #00ff66; color: #000; }
        
        .mode-btn { background: #222; color: #ffcc00; border: 1px solid #ffcc00; font-size: 12px; padding: 6px; width: 100%; cursor: pointer; border-radius: 4px; font-family: monospace;}
        .mode-btn:hover { background: #ffcc00; color: #000; }
        .random-btn { background: #222; color: #00ccff; border: 1px solid #00ccff; }
        .random-btn:hover { background: #00ccff; color: #000; }

        .telemetry-readout {
            width: 100%; background: #050505; border: 2px solid #222; border-radius: 6px;
            padding: 12px; box-sizing: border-box; color: var(--crt-green); min-height: 160px;
            box-shadow: inset 0 0 15px #000;
        }
        .data-row { margin: 6px 0; font-size: 11px; display: flex; justify-content: space-between; border-bottom: 1px dashed #222; padding-bottom: 3px; }
        .data-label { color: #777; }
        .data-value { font-weight: bold; }
        
        .quick-index-list {
            width: 100%; background: var(--panel-bg); border: 1px solid #333; border-radius: 4px; 
            padding: 8px; box-sizing: border-box; flex-grow: 1; overflow-y: auto;
        }
        .quick-item { font-size: 11px; color: #3399ff; padding: 5px 0; cursor: pointer; border-bottom: 1px dotted #222; display: flex; justify-content: space-between; }
        .quick-item:hover { color: #ff6600; background: #1a1a1a; }
        
        .version { position: absolute; top: 15px; right: 25px; color: #ff6600; font-size: 11px; font-weight: bold; z-index: 100; }
        
        @media (max-width: 900px) {
            .main-stage { flex-direction: column; }
            .glass-tube { min-height: 40vh; }
        }
    </style>
</head>
<body>

<div class="version">ASSNA // V171 SWEEP & SCANLINES</div>

<div id="cabinet">
    <div class="main-stage">
        <!-- CRT SCREEN / EMBEDDED OPTICAL WINDOW -->
        <div class="glass-tube">
            <div id="aladin-lite-div"></div>
            <!-- CRT overlay effect -->
            <div class="scanlines"></div>
        </div>

        <!-- CONTROL CONSOLE -->
        <div class="side-panel">
            <div class="title-grille">
                <div id="title-display">INITIALIZING...</div>
            </div>

            <!-- NEW INPUT ROW WITH SWEEP CONTROLS -->
            <div class="input-row">
                <button class="sweep-btn" onclick="sweepNode(-1)">&#9664;</button>
                <input type="number" id="nodeInput" placeholder="ID" min="1" max="100000" onkeydown="handleKeySweep(event)">
                <button class="sweep-btn" onclick="sweepNode(1)">&#9654;</button>
                <button onclick="lookupNode()">LOCK</button>
            </div>
            
            <button class="mode-btn random-btn" onclick="randomJump()">DEEP SPACE JUMP (RANDOM)</button>

            <button class="mode-btn" onclick="toggleTrueFullscreen()">TOGGLE FULLSCREEN CRT</button>

            <!-- TELEMETRY READOUT -->
            <div class="telemetry-readout" id="sideTelemetry">
                <div style="color: #555; text-align: center; margin-top: 50px; font-size: 11px;">
                    AWAITING TARGET LOCK...
                </div>
            </div>

            <div style="color: #aaa; font-size: 11px; width: 100%; margin-top: 5px;">SECTOR ANCHORS:</div>
            <div class="quick-index-list" id="quickIndexList">
                <div style="color: #666; font-size: 10px;">Loading index...</div>
            </div>
        </div>
    </div>
</div>

<!-- Aladin Lite v3 JavaScript API -->
<script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>

<script>
    let globalRegistry = {};
    let aladin = null;
    let nodeCount = 0;

    const titleDisp = document.getElementById('title-display');
    const sideTelemetry = document.getElementById('sideTelemetry');
    const inputNode = document.getElementById('nodeInput');

    // Initialize Embedded Aladin Lite v3
    A.init.then(() => {
        aladin = A.aladin('#aladin-lite-div', {
            survey: 'P/DSS2/color',
            fov: 1.0,
            target: '90.0 0.0',
            showReticle: true,
            showZoomControl: true,
            showFullscreenControl: false,
            showLayersControl: true,
            showSimbadPointerControl: true
        });
    }).catch(err => {
        titleDisp.innerText = "OPTICS FAILED";
    });

    document.addEventListener('fullscreenchange', () => {
        setTimeout(() => window.dispatchEvent(new Event('resize')), 200);
    });

    fetch('nodes.json?' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
            globalRegistry = data;
            nodeCount = Object.keys(data).length;
            titleDisp.innerText = `ONLINE // ${nodeCount.toLocaleString()} NODES`;
            buildQuickIndex();
        })
        .catch(err => {
            titleDisp.innerText = "LOAD ERROR";
        });

    function buildQuickIndex() {
        const listContainer = document.getElementById('quickIndexList');
        listContainer.innerHTML = '';
        const sampleKeys = [1, 2, 7, 26, 920, 2262, 9212, 15000, 26892, 49999, 77777, 99996];
        
        sampleKeys.forEach(id => {
            if (globalRegistry[id]) {
                const node = globalRegistry[id];
                const div = document.createElement('div');
                div.className = 'quick-item';
                div.innerHTML = `<span>#${id} (T${node.t})</span><span>${node.l} ly</span>`;
                div.onclick = () => {
                    inputNode.value = id;
                    lookupNode();
                };
                listContainer.appendChild(div);
            }
        });
    }

    // New Function: Sweep +/- 1 Node
    function sweepNode(direction) {
        if (nodeCount === 0) return;
        let current = parseInt(inputNode.value) || 1;
        let next = current + direction;
        if (next < 1) next = 1;
        if (next > nodeCount) next = nodeCount;
        inputNode.value = next;
        lookupNode();
    }

    // New Function: Up/Down arrow keys trigger sweep
    function handleKeySweep(event) {
        if (event.key === 'Enter') {
            lookupNode();
        } else if (event.key === 'ArrowUp') {
            event.preventDefault();
            sweepNode(1);
        } else if (event.key === 'ArrowDown') {
            event.preventDefault();
            sweepNode(-1);
        }
    }

    // New Function: Deep Space Jump
    function randomJump() {
        if (nodeCount === 0) return;
        const randomId = Math.floor(Math.random() * nodeCount) + 1;
        inputNode.value = randomId;
        lookupNode();
    }

    function lookupNode() {
        const rawVal = inputNode.value.trim();
        const val = parseInt(rawVal, 10);
        
        if (nodeCount === 0) return;
        if (isNaN(val) || !globalRegistry[val]) {
            alert(`Target #${rawVal} out of sweep range (1-${nodeCount}).`);
            return;
        }

        const node = globalRegistry[val];
        titleDisp.innerText = `LOCKED: ${node.i}`;

        if (aladin) {
            aladin.gotoRaDec(node.r, node.e);
            aladin.setFoV(1.0);
        }

        sideTelemetry.innerHTML = `
            <div style="color: #ff6600; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; text-align: center; font-size: 12px;">
                NODE // ${node.i}
            </div>
            <div class="data-row"><span class="data-label">TIER / SHELL:</span> <span class="data-value">TIER ${node.t}</span></div>
            <div class="data-row"><span class="data-label">DIST (PARSEC):</span> <span class="data-value">${node.d} pc</span></div>
            <div class="data-row"><span class="data-label">DIST (LY):</span> <span class="data-value">${node.l} ly</span></div>
            <div class="data-row"><span class="data-label">COORDINATES:</span> <span class="data-value">${node.r}°, ${node.e}°</span></div>
            <div class="data-row"><span class="data-label">MAGNITUDE:</span> <span class="data-value">${node.m}</span></div>
            <div class="data-row"><span class="data-label">HARMONIC SIG:</span> <span class="data-value">${node.h}</span></div>
        `;
    }

    function toggleTrueFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable fullscreen: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }
</script>

</body>
</html>
