<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>1960s Archive Television (Direct HTML)</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
            color: #d4d4d4;
        }
        
        /* The TV Cabinet */
        .tv-cabinet {
            background: #4a2e15; /* Dark wood color */
            border: 15px solid #2c1a0a;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            gap: 30px;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            max-width: 900px;
        }

        /* The Screen Area */
        .screen-bezel {
            background: #111;
            padding: 20px;
            border-radius: 40px; /* Rounded tube look */
            border: 5px solid #222;
            box-shadow: inset 0 0 15px #000;
            position: relative;
        }

        .screen-container {
            width: 600px;
            aspect-ratio: 4 / 3; /* Classic TV format */
            background-color: #051005;
            position: relative;
            overflow: hidden;
            border-radius: 30px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.2) sepia(0.3) hue-rotate(80deg) brightness(1.1); /* Greenish tint to the video itself */
        }

        /* CRT Effects Overlay */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; /* Scanlines */
            z-index: 10;
        }

        .crt-glow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 50px rgba(0, 255, 0, 0.1);
            background: radial-gradient(circle, rgba(0,255,0,0.05) 0%, rgba(0,0,0,0.4) 100%);
            z-index: 11;
        }

        /* Side Controls Panel */
        .control-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            background: #b5a489; /* Metallic/Plastic faceplate */
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #8c7b60;
            width: 120px;
        }

        .knob-container {
            text-align: center;
        }

        .knob-label {
            color: #222;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-size: 14px;
        }

        .knob {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #555 30%, #222 100%);
            border-radius: 50%;
            border: 4px solid #111;
            position: relative;
            cursor: pointer;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s ease-out;
        }

        .knob-indicator {
            width: 6px;
            height: 30px;
            background: #ddd;
            position: absolute;
            top: 5px;
            left: 37px;
            border-radius: 3px;
        }

        #channel-display {
            color: #2eff2e;
            background: #111;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 24px;
            text-shadow: 0 0 10px #2eff2e;
            margin-top: 10px;
            width: 60px;
            text-align: center;
            border: 2px inset #333;
        }
        
        .info-text {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #2eff2e;
            text-shadow: 0 0 5px #2eff2e;
            z-index: 15;
            font-size: 18px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="tv-cabinet">
        <div class="screen-bezel">
            <div class="screen-container">
                <video id="tv-screen" autoplay controls></video>
                <div class="crt-overlay"></div>
                <div class="crt-glow"></div>
                <div id="osd-info" class="info-text"></div>
            </div>
        </div>

        <div class="control-panel">
            <div class="knob-container">
                <div class="knob-label">VHF Channel</div>
                <div class="knob" id="channel-knob" onclick="changeChannel()">
                    <div class="knob-indicator"></div>
                </div>
                <div id="channel-display">CH 02</div>
            </div>

            <div class="knob-container">
                <div class="knob-label">Volume</div>
                <div class="knob" id="volume-knob" onclick="startVolumeChange()">
                    <div class="knob-indicator"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // The raw JSON array moved straight into JS
        const channels = [
            {
                "channel": 2,
                "title": "Project UFO S01E01 (1978)",
                "url": "https://archive.org/download/project-ufo-complete-series-1978/Project%20UFO%20S01E01%20-%20The%20Washington%20DC%20Incident.mp4"
            },
            {
                "channel": 3,
                "title": "The Bell System Science Series: Our Mr. Sun (1956)",
                "url": "https://archive.org/download/our_mr_sun/our_mr_sun_512kb.mp4"
            },
            {
                "channel": 4,
                "title": "Apollo 11 Original EVA Broadcast (1969)",
                "url": "https://archive.org/download/Apollo11AudioVideo/Apollo11_EVA.mp4"
            },
            {
                "channel": 5,
                "title": "Physics: Frame of Reference (1960)",
                "url": "https://archive.org/download/frames_of_reference/frames_of_reference_512kb.mp4"
            }
        ];

        let currentChannelIndex = 0;
        let currentVolume = 0.5; // Start at 50%
        let volumeRotation = 0;

        const videoPlayer = document.getElementById('tv-screen');
        const channelDisplay = document.getElementById('channel-display');
        const channelKnob = document.getElementById('channel-knob');
        const volumeKnob = document.getElementById('volume-knob');
        const osdInfo = document.getElementById('osd-info');

        // Initialize TV
        function loadChannel(index) {
            const channel = channels[index];
            videoPlayer.src = channel.url;
            channelDisplay.innerText = "CH " + channel.channel.toString().padStart(2, '0');
            
            // Show On-Screen Display info briefly
            osdInfo.innerText = channel.title;
            osdInfo.style.display = 'block';
            setTimeout(() => { osdInfo.style.display = 'none'; }, 4000);
        }

        function changeChannel() {
            currentChannelIndex = (currentChannelIndex + 1) % channels.length;
            
            // Rotate the knob physically
            let rotation = (currentChannelIndex * (360 / channels.length));
            channelKnob.style.transform = `rotate(${rotation}deg)`;
            
            loadChannel(currentChannelIndex);
        }

        // Simple Volume Logic (click to step up 25%)
        function startVolumeChange() {
            currentVolume += 0.25;
            if (currentVolume > 1.0) currentVolume = 0; // Wrap around to 0
            
            videoPlayer.volume = currentVolume;
            
            // Rotate volume knob based on percentage
            volumeRotation = currentVolume * 270 - 135; // Map 0-1 to -135deg to +135deg
            volumeKnob.style.transform = `rotate(${volumeRotation}deg)`;
        }

        // Set initial state
        videoPlayer.volume = currentVolume;
        loadChannel(currentChannelIndex);
    </script>
</body>
</html>
