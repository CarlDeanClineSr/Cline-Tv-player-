<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLINE CLASSIC TV</title>
  <style>
    :root{
      --bg:#080808;
      --cab:#151515;
      --trim:#050505;
      --metal1:#4e4e4e;
      --metal2:#2a2a2a;
      --screen:#000;
      --text:#e8e8e8;
      --accent:#ff6a00;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:#000;
      color:var(--text);
      font-family:"Courier New", monospace;
      height:100%;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    #tv{
      width:min(96vw,1280px);
      height:min(94vh,900px);
      background:linear-gradient(180deg,#121212,#0a0a0a);
      border:22px solid var(--trim);
      border-radius:28px;
      box-shadow:
        0 40px 90px rgba(0,0,0,.9),
        inset 0 0 140px rgba(0,0,0,.9);
      padding:22px;
      position:relative;
      display:flex;
      gap:20px;
    }

    .screen-area{
      flex:1;
      background:var(--screen);
      border:16px solid #1d1d1d;
      border-radius:16px;
      box-shadow:inset 0 0 80px rgba(0,0,0,.95);
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width:0;
    }

    .screen-area::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.05), rgba(255,255,255,0) 18%, rgba(255,255,255,.025) 50%, rgba(0,0,0,.12)),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.02) 0px,
          rgba(255,255,255,.02) 1px,
          transparent 3px,
          transparent 4px
        );
      mix-blend-mode:screen;
    }

    .screen-area::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      box-shadow:inset 0 0 120px rgba(0,0,0,.75);
      border-radius:12px;
    }

    video,audio{
      width:100%;
      height:100%;
      background:#000;
    }

    video{
      object-fit:contain;
      display:block;
    }

    audio{
      width:90%;
      height:64px;
      display:none;
      filter:invert(.9);
    }

    .panel{
      width:min(300px,28%);
      min-width:250px;
      background:linear-gradient(180deg,var(--metal1),var(--metal2));
      border:10px solid #111;
      border-radius:12px;
      box-shadow:inset 0 0 40px rgba(0,0,0,.75);
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .topline{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      font-size:12px;
      color:var(--accent);
      font-weight:bold;
    }

    .title-box{
      background:repeating-linear-gradient(
        45deg,
        #222, #222 5px,
        #191919 5px, #191919 12px
      );
      border:7px solid #111;
      border-radius:8px;
      height:60px;
      overflow:hidden;
      display:flex;
      align-items:center;
      padding:0 10px;
    }

    .title-viewport{
      width:100%;
      overflow:hidden;
      white-space:nowrap;
      position:relative;
    }

    #titleTrack{
      display:inline-block;
      white-space:nowrap;
      font-size:14px;
      font-weight:bold;
      text-transform:uppercase;
      text-shadow:0 0 6px #000;
      transform:translateX(0);
    }

    #titleTrack.scroll{
      animation:scrollTitle 18s linear infinite;
      padding-right:40px;
    }

    @keyframes scrollTitle{
      from{transform:translateX(0)}
      to{transform:translateX(-100%)}
    }

    .section{
      background:rgba(0,0,0,.18);
      border:1px solid rgba(255,255,255,.08);
      border-radius:10px;
      padding:10px;
    }

    .label{
      font-size:12px;
      margin-bottom:8px;
      color:#efefef;
      text-transform:uppercase;
    }

    .dial-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      padding:8px 0;
    }

    .dial-block{
      position:relative;
      width:140px;
      height:140px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .ring{
      position:absolute;
      width:140px;
      height:140px;
      border-radius:50%;
      pointer-events:none;
    }

    .number{
      position:absolute;
      width:24px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      color:#f0f0f0;
      text-shadow:0 0 4px #000;
      transform:translate(-50%,-50%);
    }

    .tick{
      position:absolute;
      width:2px;
      height:8px;
      background:#888;
      left:50%;
      top:50%;
      transform-origin:center center;
      opacity:.8;
    }

    .knob{
      width:74px;
      height:74px;
      border-radius:50%;
      background:#1c1c1c;
      border:9px solid #0f0f0f;
      box-shadow:0 8px 20px rgba(0,0,0,.85);
      position:relative;
      cursor:pointer;
      user-select:none;
    }

    .knob::after{
      content:"";
      position:absolute;
      left:50%;
      top:14px;
      transform:translateX(-50%);
      width:4px;
      height:24px;
      border-radius:3px;
      background:#ddd;
    }

    .hint{
      text-align:center;
      font-size:11px;
      color:#ddd;
      line-height:1.35;
    }

    .row{
      display:flex;
      gap:8px;
      align-items:center;
    }

    button, input[type="range"]{
      font-family:inherit;
    }

    button{
      background:#101010;
      color:#f5f5f5;
      border:1px solid #444;
      border-radius:8px;
      padding:10px 12px;
      cursor:pointer;
      width:100%;
    }

    button:hover{border-color:#777}

    .status{
      min-height:18px;
      font-size:12px;
      color:#d7d7d7;
    }

    .version-tag,
    .fs-btn{
      position:absolute;
      top:14px;
      z-index:5;
      background:#111;
      border:1px solid #444;
      color:#fff;
      border-radius:8px;
      padding:8px 12px;
      font-size:11px;
      font-weight:bold;
    }

    .fs-btn{left:14px; cursor:pointer;}
    .version-tag{right:14px; color:var(--accent);}

    @media (max-width: 900px){
      body{overflow:auto}
      #tv{
        width:100vw;
        min-height:100vh;
        height:auto;
        border-radius:0;
        border-width:12px;
        display:block;
      }
      .screen-area{
        min-height:52vh;
        margin-bottom:16px;
      }
      .panel{
        width:100%;
        min-width:0;
      }
    }
  </style>
</head>
<body>
  <div id="tv">
    <button class="fs-btn" id="fsBtn">FULL SCREEN</button>
    <div class="version-tag">V3 CLASSIC</div>

    <div class="screen-area" id="screenArea">
      <video id="videoPlayer" autoplay controls playsinline webkit-playsinline></video>
      <audio id="audioPlayer" controls></audio>
    </div>

    <aside class="panel">
      <div class="topline">
        <div>CLINE CLASSIC TV</div>
        <div id="catReadout">CAT A</div>
      </div>

      <div class="title-box">
        <div class="title-viewport">
          <div id="titleTrack">STANDBY</div>
        </div>
      </div>

      <div class="section">
        <div class="label">Channel Tuner</div>
        <div class="dial-wrap">
          <div class="dial-block">
            <div class="ring" id="channelRing"></div>
            <div class="knob" id="channelKnob" title="Left click next / right click previous"></div>
          </div>
        </div>
        <div class="hint">Left click = next channel<br>Right click = previous channel</div>
      </div>

      <div class="section">
        <div class="label">Category Selector</div>
        <div class="dial-wrap">
          <div class="dial-block">
            <div class="ring" id="categoryRing"></div>
            <div class="knob" id="categoryKnob" title="Left click next / right click previous"></div>
          </div>
        </div>
        <div class="hint">Switch category A / B / C / ...</div>
      </div>

      <div class="section">
        <div class="label">Controls</div>
        <div class="row">
          <button id="playBtn">PLAY</button>
          <button id="reloadBtn">RELOAD</button>
        </div>
      </div>

      <div class="section">
        <div class="label">Volume</div>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="0.7" style="width:100%" />
      </div>

      <div class="section">
        <div class="label">Status</div>
        <div class="status" id="statusText">Ready.</div>
      </div>
    </aside>
  </div>

  <script>
    // REPLACE / EXPAND THESE WITH YOUR FULL ARRAYS
    const categories = [
      {
        name: "A",
        items: [
          { n: "A. Einstein", u: "https://archive.org/download/NOVAAEinstein/NOVA.S06E09.A.Einstein.VHSRip.AAC2.0.x264-RATTERA.mp4" },
          { n: "NASA UFO Footages", u: "https://archive.org/download/NASAfootages/UFOs.avi" },
          { n: "Pink Panther: Olympinks", u: "https://archive.org/download/ThePinkPanther-cartoons/The Pink Panther in -OLYMPINKS!.mp4" },
          { n: "Unacknowledged", u: "https://ia601407.us.archive.org/8/items/unacknowledged.-2017.308p/Unacknowledged%20%282017%29/Unacknowledged.2017.308p.mp4" }
        ]
      },
      {
        name: "B",
        items: [
          { n: "Arthur C Clarkes World of Strange Powers - From Mind to Mind", u: "https://archive.org/download/arthur-c-clarkes-world-of-strange-powers-complete-series-1985/Arthur C Clarkes - World of Strange Powers S01E03 - From Mind to Mind.mp4" },
          { n: "Project UFO S01E01 - The Washington DC Incident", u: "https://archive.org/download/Project-UFO-1978-Series/Project%20UFO%20%2826%20of%2026%29/S01E01%20-%20Sighting%204001%20-%20The%20Washington%20DC%20Incident.mp4" },
          { n: "Project UFO S01E02 - The Joshua Flats Incident", u: "https://archive.org/download/Project-UFO-1978-Series/Project%20UFO%20%2826%20of%2026%29/S01E02%20-%20Sighting%204002%20-%20The%20Joshua%20Flats%20Incident.mp4" }
        ]
      },
      {
        name: "C",
        items: [
          { n: "Plymouth Fury 1968 Ad", u: "https://archive.org/download/classic-car-commercials/Plymouth_Fury_1968.mp4" },
          { n: "Dodge Charger 1969 Commercial", u: "https://archive.org/download/classic-car-commercials/Dodge_Charger_1969.mp4" },
          { n: "Arthur C Clarke | Fractals | The Colors Of Infinity", u: "https://archive.org/download/youtube-IptmGRQiZg0/IptmGRQiZg0.mp4" }
        ]
      },
      {
        name: "J",
        items: [
          { n: "A Christmas Carol", u: "https://archive.org/download/AChristmasCarolCbsRadioMysteryTheater/Cbsrmt7512240402AChristmasCarol_wbbm_rec12_24_78.mp3" },
          { n: "CBSRMT - 1974 Cold Storage", u: "https://archive.org/download/CBSRMT/CBSRMT_740113__44m18s__Cold_Storage.mp3" },
          { n: "TREASURE ISLAND FULL Audio Book", u: "https://archive.org/download/TREASUREISLANDFULLAudioBookByRobertLouisStevensonAdventurePirateFiction/TREASURE ISLAND - FULL AudioBook by Robert Louis Stevenson - Adventure - Pirate Fiction.ogv" }
        ]
      }
    ];

    const videoPlayer = document.getElementById("videoPlayer");
    const audioPlayer = document.getElementById("audioPlayer");
    const titleTrack = document.getElementById("titleTrack");
    const statusText = document.getElementById("statusText");
    const catReadout = document.getElementById("catReadout");
    const volumeSlider = document.getElementById("volumeSlider");
    const channelKnob = document.getElementById("channelKnob");
    const categoryKnob = document.getElementById("categoryKnob");

    let currentCategoryIndex = 0;
    let currentItemIndex = 0;
    let channelDeg = 0;
    let categoryDeg = 0;

    function isAudio(url){
      const u = url.toLowerCase();
      return u.endsWith(".mp3") || u.endsWith(".ogg") || u.endsWith(".wav") || u.endsWith(".m4a");
    }

    function setStatus(msg){
      statusText.textContent = msg;
    }

    function updateTitle(text){
      titleTrack.classList.remove("scroll");
      titleTrack.textContent = text;
      requestAnimationFrame(() => {
        if (titleTrack.scrollWidth > titleTrack.parentElement.clientWidth) {
          titleTrack.classList.add("scroll");
        }
      });
    }

    function stopPlayers(){
      videoPlayer.pause();
      audioPlayer.pause();
      videoPlayer.style.display = "none";
      audioPlayer.style.display = "none";
      videoPlayer.removeAttribute("src");
      audioPlayer.removeAttribute("src");
      videoPlayer.load();
      audioPlayer.load();
    }

    function playCurrent(){
      const cat = categories[currentCategoryIndex];
      const item = cat.items[currentItemIndex];
      if (!item) return;

      stopPlayers();
      updateTitle(item.n);
      catReadout.textContent = `CAT ${cat.name}`;
      setStatus(`Loading: ${item.n}`);

      if (isAudio(item.u)) {
        audioPlayer.style.display = "block";
        audioPlayer.src = item.u;
        audioPlayer.volume = parseFloat(volumeSlider.value);
        audioPlayer.load();
        audioPlayer.play()
          .then(() => setStatus(`Audio playing — ${cat.name}-${currentItemIndex + 1}`))
          .catch(() => setStatus("Playback blocked. Press PLAY."));
      } else {
        videoPlayer.style.display = "block";
        videoPlayer.src = item.u;
        videoPlayer.volume = parseFloat(volumeSlider.value);
        videoPlayer.load();
        videoPlayer.play()
          .then(() => setStatus(`Video playing — ${cat.name}-${currentItemIndex + 1}`))
          .catch(() => setStatus("Playback blocked. Press PLAY."));
      }
    }

    function nextChannel(){
      const items = categories[currentCategoryIndex].items;
      currentItemIndex = (currentItemIndex + 1) % items.length;
      channelDeg += 360 / Math.max(items.length, 10);
      channelKnob.style.transform = `rotate(${channelDeg}deg)`;
      playCurrent();
    }

    function prevChannel(){
      const items = categories[currentCategoryIndex].items;
      currentItemIndex = (currentItemIndex - 1 + items.length) % items.length;
      channelDeg -= 360 / Math.max(items.length, 10);
      channelKnob.style.transform = `rotate(${channelDeg}deg)`;
      playCurrent();
    }

    function nextCategory(){
      currentCategoryIndex = (currentCategoryIndex + 1) % categories.length;
      currentItemIndex = 0;
      categoryDeg += 360 / Math.max(categories.length, 10);
      categoryKnob.style.transform = `rotate(${categoryDeg}deg)`;
      drawChannelRing();
      playCurrent();
    }

    function prevCategory(){
      currentCategoryIndex = (currentCategoryIndex - 1 + categories.length) % categories.length;
      currentItemIndex = 0;
      categoryDeg -= 360 / Math.max(categories.length, 10);
      categoryKnob.style.transform = `rotate(${categoryDeg}deg)`;
      drawChannelRing();
      playCurrent();
    }

    function drawCategoryRing(){
      const ring = document.getElementById("categoryRing");
      ring.innerHTML = "";
      const count = categories.length;
      const radius = 58;

      for(let i=0;i<count;i++){
        const angle = (360 / count) * i - 90;
        const rad = angle * Math.PI / 180;
        const x = 70 + radius * Math.cos(rad);
        const y = 70 + radius * Math.sin(rad);

        const num = document.createElement("div");
        num.className = "number";
        num.style.left = `${x}px`;
        num.style.top = `${y}px`;
        num.textContent = categories[i].name;
        ring.appendChild(num);
      }
    }

    function drawChannelRing(){
      const ring = document.getElementById("channelRing");
      ring.innerHTML = "";
      const count = Math.min(Math.max(categories[currentCategoryIndex].items.length, 1), 12);
      const radius = 58;

      for(let i=0;i<count;i++){
        const angle = (360 / count) * i;
        const tick = document.createElement("div");
        tick.className = "tick";
        tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-${radius}px)`;
        ring.appendChild(tick);

        const a2 = angle - 90;
        const rad = a2 * Math.PI / 180;
        const x = 70 + radius * Math.cos(rad);
        const y = 70 + radius * Math.sin(rad);

        const num = document.createElement("div");
        num.className = "number";
        num.style.left = `${x}px`;
        num.style.top = `${y}px`;
        num.textContent = i + 1;
        ring.appendChild(num);
      }
    }

    channelKnob.addEventListener("click", nextChannel);
    channelKnob.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      prevChannel();
    });

    categoryKnob.addEventListener("click", nextCategory);
    categoryKnob.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      prevCategory();
    });

    document.getElementById("playBtn").addEventListener("click", () => {
      if (videoPlayer.style.display !== "none" && videoPlayer.src) {
        videoPlayer.play().catch(() => {});
      }
      if (audioPlayer.style.display !== "none" && audioPlayer.src) {
        audioPlayer.play().catch(() => {});
      }
    });

    document.getElementById("reloadBtn").addEventListener("click", playCurrent);

    volumeSlider.addEventListener("input", (e) => {
      const v = parseFloat(e.target.value);
      videoPlayer.volume = v;
      audioPlayer.volume = v;
    });

    document.getElementById("fsBtn").addEventListener("click", async () => {
      const el = document.getElementById("tv");
      if (!document.fullscreenElement) {
        await el.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    });

    videoPlayer.addEventListener("ended", nextChannel);
    audioPlayer.addEventListener("ended", nextChannel);

    videoPlayer.addEventListener("error", () => {
      setStatus("Video error. Skipping.");
      setTimeout(nextChannel, 1200);
    });

    audioPlayer.addEventListener("error", () => {
      setStatus("Audio error. Skipping.");
      setTimeout(nextChannel, 1200);
    });

    drawCategoryRing();
    drawChannelRing();
    playCurrent();
  </script>
</body>
</html>
