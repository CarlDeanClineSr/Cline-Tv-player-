<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>ASSNA // STELLAR NAVIGATOR V169</title>
    
    <!-- Corrected Aladin Lite v3 CSS -->
    <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css" />
    
    <style>
        body { 
            background: #0a0a0a; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.4s ease;
        }
        #cabinet { 
            width: min(98vw, 1300px); 
            height: min(95vh, 920px); 
            background: #0f0f0f; 
            border: clamp(14px, 3vw, 24px) solid #0a0a0a;
            border-radius: 28px; 
            box-shadow: 0 60px 100px #000, inset 0 0 140px #000; 
            display: flex; 
            flex-direction: column; 
            padding: clamp(15px, 3vw, 30px) clamp(20px, 4vw, 50px); 
            position: relative; 
            box-sizing: border-box;
            align-items: center;
            transition: all 0.4s ease;
        }
        
        /* THEATER MODE CLASSES */
        #cabinet.theater-mode {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            border: 4px solid #1c1c1c;
            padding: 15px;
        }
        .main-stage {
            display: flex;
            width: 100%;
            height: 70vh;
            gap: 20px;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: all 0.4s ease;
        }
        #cabinet.theater-mode .main-stage {
            flex-direction: column;
            height: 100%;
            gap: 10px;
        }

        .glass-tube { 
            flex: 2;
            height: 100%;
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            border: clamp(10px, 2vw, 16px) solid #1c1c1c; 
            box-shadow: inset 0 0 60px #000, 0 0 40px #000; 
            position: relative;
            box-sizing: border-box;
            transition: all 0.4s ease;
        }
        #cabinet.theater-mode .glass-tube {
            flex: 1; /* Takes up most of the screen in theater mode */
        }

        #aladin-lite-div { width: 100%; height: 100%; }
        
        .telemetry-overlay-box {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            color: #00ff66;
            display: none; 
            z-index: 10;
        }
        
        .side-panel { 
            flex: 1;
            background: linear-gradient(#3a3a3a, #1f1f1f); 
            border: clamp(8px, 2vw, 12px) solid #111; 
            border-radius: 10px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px; 
            box-shadow: inset 0 0 30px #000; 
            box-sizing: border-box;
            max-height: 100%;
            overflow-y: auto;
            transition: all 0.4s ease;
        }
        #cabinet.theater-mode .side-panel {
            flex: none;
            flex-direction: row;
            height: 100px;
            overflow-y: hidden;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 20px;
        }

        .title-grille { 
            width: 100%; 
            height: 40px; 
            background: repeating-linear-gradient(45deg, #222, #222 5px, #1a1a1a 5px, #1a1a1a 14px); 
            border: 3px solid #111; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0 10px; 
            box-sizing: border-box;
        }
        #cabinet.theater-mode .title-grille { width: 250px; }
        
        #title-display {
            color: #ff6600; font-size: 13px; font-weight: bold; text-transform: uppercase; text-shadow: 0 0 6px #000;
        }
        .input-row { display: flex; gap: 8px; width: 100%; justify-content: center; }
        #cabinet.theater-mode .input-row { width: auto; align-items: center; }
        
        input[type="number"] {
            background: #000; border: 2px solid #333; color: #00ff66; padding: 6px; font-size: 15px; font-family: monospace; width: 120px; text-align: center; border-radius: 4px; outline: none;
        }
        button {
            background: #ff6600; color: #000; border: none; padding: 6px 14px; font-weight: bold; font-family: monospace; border-radius: 4px; cursor: pointer;
        }
        button:hover { background: #ff8833; }
        
        .mode-btn { background: #222; color: #00ff66; border: 1px solid #00ff66; font-size: 11px; padding: 4px 8px; width: 100%; cursor: pointer; }
        .mode-btn:hover { background: #00ff66; color: #000; }
        #cabinet.theater-mode .mode-btn { width: auto; height: 35px; }

        .data-row { margin: 6px 0; font-size: 12px; display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .data-label { color: #888; }
        .data-value { color: #00ff66; font-weight: bold; }
        
        .quick-index-list {
            width: 100%; background: #111; border: 1px solid #333; border-radius: 4px; padding: 8px; box-sizing: border-box; max-height: 180px; overflow-y: auto;
        }
        #cabinet.theater-mode .quick-index-list { display: none; /* Hide index in theater mode to save space */ }

        .quick-item { font-size: 11px; color: #3399ff; padding: 4px 0; cursor: pointer; border-bottom: 1px dotted #222; display: flex; justify-content: space-between; }
        .quick-item:hover { color: #ff6600; background: #1a1a1a; }
        .version { position: absolute; top: 15px; right: 25px; color: #ff6600; font-size: 11px; font-weight: bold; z-index: 100; }
        
        @media (max-width: 900px) {
            .main-stage { flex-direction: column; height: auto; }
            .glass-tube { height: 45vh; width: 100%; }
            .side-panel { width: 100%; }
        }
    </style>
</head>
<body>

<div class="version">ASSNA // V169 THEATER OPTICS</div>

<div id="cabinet">
    <div class="main-stage">
        <!-- CRT SCREEN / EMBEDDED OPTICAL WINDOW -->
        <div class="glass-tube">
            <!-- Embedded Aladin Lite v3 Engine -->
            <div id="aladin-lite-div"></div>

            <!-- Telemetry HUD Overlay (Toggled) -->
            <div class="telemetry-overlay-box" id="telemetryOverlay">
                <div style="color: #ff6600; font-weight: bold; margin-bottom: 10px; border-bottom: 1px dashed #444; padding-bottom: 4px;" id="hudTitle">
                    SYSTEM STANDBY
                </div>
                <div id="hudContent" style="font-size: 12px; line-height: 1.5;">
                    Awaiting target lock from command console.
                </div>
            </div>
        </div>

        <!-- CONTROL CONSOLE -->
        <div class="side-panel">
            <div class="title-grille">
                <div id="title-display">INITIALIZING...</div>
            </div>

            <div class="input-row">
                <input type="number" id="nodeInput" placeholder="ID (1-100k)" min="1" max="100000" onkeydown="if(event.key==='Enter') lookupNode()">
                <button onclick="lookupNode()">LOCK</button>
            </div>

            <div style="display: flex; gap: 5px; width: 100%; justify-content: center;">
                <button class="mode-btn" onclick="toggleViewMode()" id="modeToggleBtn">HUD ON/OFF</button>
                <button class="mode-btn" onclick="toggleTheaterMode()" style="border-color: #ffcc00; color: #ffcc00;">ENLARGE CRT</button>
            </div>

            <div class="quick-index-list" id="quickIndexList">
                <div style="color: #666; font-size: 10px;">Loading index anchors...</div>
            </div>
        </div>
    </div>
</div>

<!-- Corrected Aladin Lite v3 JavaScript API -->
<script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>

<script>
    let globalRegistry = {};
    let aladin = null;
    let hudMode = false; 

    const titleDisp = document.getElementById('title-display');
    const telemetryOverlay = document.getElementById('telemetryOverlay');
    const hudTitle = document.getElementById('hudTitle');
    const hudContent = document.getElementById('hudContent');
    const cabinet = document.getElementById('cabinet');

    // Initialize Embedded Aladin Lite v3
    A.init.then(() => {
        aladin = A.aladin('#aladin-lite-div', {
            survey: 'P/DSS2/color',
            fov: 1.0,
            target: '90.0 0.0',
            showReticle: true,
            showZoomControl: true,
            showFullscreenControl: false,
            showLayersControl: true
        });
    }).catch(err => {
        console.error("Aladin Init Error:", err);
        titleDisp.innerText = "OPTICS FAILED";
    });

    // Fetch full nodes.json database
    fetch('nodes.json?' + new Date().getTime())
        .then(response => {
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return response.json();
        })
        .then(data => {
            globalRegistry = data;
            const count = Object.keys(data).length;
            titleDisp.innerText = `ONLINE // ${count.toLocaleString()} NODES`;
            buildQuickIndex();
        })
        .catch(err => {
            console.error("Fetch error:", err);
            titleDisp.innerText = "LOAD ERROR";
        });

    function buildQuickIndex() {
        const listContainer = document.getElementById('quickIndexList');
        listContainer.innerHTML = '';
        const sampleKeys = [1, 2, 7, 26, 920, 2262, 9212, 15000, 26892, 49999, 77777, 99996];
        
        sampleKeys.forEach(id => {
            if (globalRegistry[id]) {
                const node = globalRegistry[id];
                const div = document.createElement('div');
                div.className = 'quick-item';
                div.innerHTML = `<span>#${id} (T${node.t})</span><span>${node.l} ly</span>`;
                div.onclick = () => {
                    document.getElementById('nodeInput').value = id;
                    lookupNode();
                };
                listContainer.appendChild(div);
            }
        });
    }

    function lookupNode() {
        const rawVal = document.getElementById('nodeInput').value.trim();
        const val = parseInt(rawVal, 10);
        
        if (Object.keys(globalRegistry).length === 0) return;
        if (isNaN(val) || !globalRegistry[val]) {
            alert(`Target #${rawVal} out of sweep range (1-100000).`);
            return;
        }

        const node = globalRegistry[val];
        titleDisp.innerText = `LOCKED: ${node.i}`;

        if (aladin) {
            aladin.gotoRaDec(node.r, node.e);
            aladin.setFoV(1.0);
        }

        hudTitle.innerText = `ORDERED SWEEP LOCK // SEQUENCE #${val}`;
        hudContent.innerHTML = `
            <div class="data-row"><span class="data-label">TARGET ID:</span> <span class="data-value">${node.i}</span></div>
            <div class="data-row"><span class="data-label">SHELL TIER:</span> <span class="data-value">TIER ${node.t}</span></div>
            <div class="data-row"><span class="data-label">DISTANCE (PC):</span> <span class="data-value">${node.d} pc</span></div>
            <div class="data-row"><span class="data-label">DISTANCE (LY):</span> <span class="data-value">${node.l} ly</span></div>
            <div class="data-row"><span class="data-label">RIGHT ASCENSION:</span> <span class="data-value">${node.r}°</span></div>
            <div class="data-row"><span class="data-label">DECLINATION:</span> <span class="data-value">${node.e}°</span></div>
            <div class="data-row"><span class="data-label">MAGNITUDE:</span> <span class="data-value">${node.m}</span></div>
            <div class="data-row"><span class="data-label">HARMONIC SIG:</span> <span class="data-value">${node.h}</span></div>
        `;
    }

    function toggleViewMode() {
        hudMode = !hudMode;
        telemetryOverlay.style.display = hudMode ? 'block' : 'none';
    }

    function toggleTheaterMode() {
        cabinet.classList.toggle('theater-mode');
        // Trigger a slight resize event so Aladin redraws its canvas properly to the new size
        setTimeout(() => window.dispatchEvent(new Event('resize')), 450);
    }
</script>

</body>
</html>
