            align-items: center; 
            justify-content: center;

        }

            background: #0f0f0f; 
            border: clamp(18px, 4vw, 28px) solid #0a0a0a;
            border-radius: 28px; 
            box-shadow: 0 60px 100px #000, inset 0 0 140px #000; 
            display: flex; 
            flex-direction: column; 
            padding: clamp(20px, 5vw, 50px) clamp(30px, 6vw, 80px); 
            position: relative; 
            overflow: hidden; 
            box-sizing: border-box;
            align-items: center;
        }
        .glass-tube { 
            width: 100%; 
            height: auto;
            aspect-ratio: 4 / 3; 
            max-height: 60vh;
            background: #000; 
            border-radius: 14px; 
            overflow: hidden; 
            border: clamp(14px, 3vw, 22px) solid #1c1c1c; 
            box-shadow: inset 0 0 90px #000, 0 0 50px #000; 
            margin-bottom: clamp(12px, 3vw, 24px);
            display: flex;
            align-items: center; 
            justify-content: center;
            position: relative;
        }

            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;

            background-size: 100% 4px;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.1);
            border-radius: 10px;
            pointer-events: none;
            z-index: 10;
        }

            opacity: 1;
        }

            0% { background-position: 0px 0px; }
            20% { background-position: -50px 20px; }
            40% { background-position: 100px -40px; }
            60% { background-position: -20px 80px; }
            80% { background-position: 60px 10px; }
            100% { background-position: 0px -50px; }

        audio {

            width: 90%;

        .right-panel {

            align-items: center; 
            justify-content: center;

        }
        .title-grille {

            border-radius: 8px; 
            display: flex; 
            align-items: center;

            padding: 0 12px; 
            box-sizing: border-box; 
            overflow: hidden;
            position: relative;
        }
        #title-display {
            color: #e0e0e0;
            font-size: clamp(13px, 3.2vw, 16px);
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 6px #444, 1px 1px 2px #000;

            overflow: hidden;
            width: 100%;
            padding: 0 40px 0 0;
            box-sizing: border-box;
            will-change: transform;

        }
        #title-display:hover, #title-display:active {
            animation-play-state: paused;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }

        .dial-housing { 
            position: relative; 
            width: 120px; 
            height: 120px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            margin: 10px 0;
        }
        .knob { 
            width: 60px; 
            height: 60px; 
            background: #1f1f1f; 
            border: 8px solid #0f0f0f; 
            border-radius: 50%; 
            cursor: pointer; 
            box-shadow: 0 8px 20px #000; 
            position: relative; 
            touch-action: manipulation;
        }
        .knob::after { 
            content: ''; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 4px; 
            height: 24px; 
            background: #ddd; 
            transform: translate(-50%, -50%); 
            transform-origin: center top;
        }
        .number-ring { 
            position: absolute; 
            width: 130px; 
            height: 130px; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none; 
        }
        .tick {
            position: absolute;
            width: 2px;
            height: 7px;
            background: #777;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            opacity: 0.8;
        }
        .cardinal {
            position: absolute;
            font-size: 9px;
            color: #ff6600;
            font-weight: bold;
            text-shadow: 0 0 3px #000;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .volume-container { 
            width: 76px; 
            height: 28px; 
            background: #222; 
            border: 4px solid #111; 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 4px auto;
        }
        .volume-slider { 
            width: 54px; 
            height: 5px; 
            background: #444; 
            border-radius: 3px; 
            outline: none; 
        }
        .volume-slider::-webkit-slider-thumb { 
            width: 18px; 
            height: 18px; 
            background: #ccc; 
            border-radius: 50%; 
            border: 3px solid #111; 
        }
        .fs-toggle { 
            position: absolute; 
            top: clamp(15px, 4vw, 25px); 
            left: clamp(15px, 4vw, 25px); 
            background: #111; 
            color: #fff; 
            border: 1px solid #444; 
            padding: clamp(8px, 2vw, 10px) clamp(12px, 3vw, 16px); 
            cursor: pointer; 
            font-size: clamp(9px, 2.5vw, 10px); 
            z-index: 100; 
            font-weight: bold; 
            border-radius: 8px; 
        }
        .version { 
            position: absolute; 
            top: clamp(15px, 4vw, 25px); 
            right: clamp(15px, 4vw, 25px); 
            color: #ff6600; 
            font-size: clamp(9px, 2.5vw, 10px); 
            font-weight: bold; 
        }

        @media (min-width: 769px) {

            #cabinet {

                padding: 50px 80px; 
                justify-content: center;

                max-height: 100%;
                margin-bottom: 0;
            }
            .right-panel { 
                width: 24%; 
                height: 100%; 
                margin-left: 20px;
                justify-content: space-evenly;
            }
            .title-grille {
                height: 56px;
            }
            #title-display {
                font-size: 16px;
            }
        }

    const J = [

        {n: "1x28 - Errand of Mercy", u: ST_BASE_URL + "1x28-ErrandOfMercy.mp4"},
        {n: "1x29 - The City on the Edge of Forever", u: ST_BASE_URL + "1x29-TheCityOnTheEdgeOfForever.mp4"},
        {n: "1x30 - Operation Annihilate!", u: ST_BASE_URL + "1x30-OperationAnnihilate.mp4"},
        {n: "Earth Was Made: The Alps", u: EARTH_BASE_URL + "History.Ch.How.the.Earth.Was.Made.Complete.Season.1.13of13.The.Alps.XviD.AC3.MVGroup.org.mp4"},
        {n: "Project UFO S02E13", u: UFO_BASE_URL + "Project%20UFO%20S02E13%20-%20The%20Wild%20Blue%20Yonder%20Incident.mp4"},
        {n: "Edge of Creation (1979)", u: "https://dn720302.ca.archive.org/0/items/NGSDivetotheEdgeofCreation/National.Geographic.Specials.S14E01.Dive.to.the.Edge.of.Creation.1980.VHSRip.DD2.0.x264-rattera.mp4"}
    ];

    // Combine and Stagger/Interleave all categories A through J so it never binge-watches one type of show
    const allCategories = [A, B, C, D, E, F, G, H, I, J];
    const masterPlaylist = [];
    const maxEpisodes = Math.max(...allCategories.map(cat => cat.length));

    for (let i = 0; i < maxEpisodes; i++) {
        for (let cat of allCategories) {
            if (cat[i]) {
                masterPlaylist.push(cat[i]);
            }
        }
    }

    let currentVideoIndex = 0;
    let tunerDeg = 0;

    let errorRetryCount = 0;
    const MAX_RETRIES = 4;

    const player = document.getElementById('player');
    const audioPlayer = document.getElementById('audio-player');
    const titleDisp = document.getElementById('title-display');
    const volumeKnob = document.getElementById('volume-knob');

    // --- AUDIO CONTEXT SYNTHESIZER FOR STATIC ---
    let audioCtx;
    function playStaticSound() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const bufferSize = audioCtx.sampleRate * 0.35; 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 2500;

        const volume = audioCtx.createGain();
        volume.gain.value = volumeKnob.value * 0.2; 

        noise.connect(filter);
        filter.connect(volume);
        volume.connect(audioCtx.destination);
        
        noise.start();
    }

    function triggerStaticDelay(actionCallback) {
        player.pause();
        audioPlayer.pause();
        player.style.opacity = '0'; 
        audioPlayer.style.opacity = '0';
        
        document.getElementById('static-overlay').classList.add('active');
        playStaticSound();

        setTimeout(() => {
            document.getElementById('static-overlay').classList.remove('active');
            player.style.opacity = '1';
            audioPlayer.style.opacity = '1';
            actionCallback();
        }, 350); 
    }

    function checkOverflow() {
        titleDisp.classList.remove('scroller-active');
        void titleDisp.offsetWidth; 
        if (titleDisp.scrollWidth > titleDisp.clientWidth + 10) {
            titleDisp.classList.add('scroller-active');
        } else {
            titleDisp.style.transform = 'translateX(0)';
        }
    }

    function updateTitleDisplay(text) {
        titleDisp.innerText = text;
        setTimeout(checkOverflow, 100);
    }

    // Build compact dial with slash ticks and cardinal points (No numbers)
    function makeDialRing(id, tickCount) {
        const ring = document.getElementById(id);
        ring.innerHTML = '';
        const radius = 46; 

        // Draw slash ticks around perimeter
        const step = 360 / tickCount;
        for (let i = 0; i < tickCount; i++) {
            const angle = i * step;
            const tick = document.createElement('div');
            tick.className = 'tick';
            tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-${radius}px)`;
            ring.appendChild(tick);
        }

        // Add Cardinal points (N, E, S, W)
        const cardinals = [
            {label: 'N', deg: 0},
            {label: 'E', deg: 90},
            {label: 'S', deg: 180},
            {label: 'W', deg: 270}
        ];

        cardinals.forEach(card => {
            const rad = (card.deg - 90) * Math.PI / 180;
            const cardRadius = radius + 15;
            const x = cardRadius * Math.cos(rad);
            const y = cardRadius * Math.sin(rad);
            const el = document.createElement('div');
            el.className = 'cardinal';
            el.style.left = `calc(50% + ${x}px)`;
            el.style.top = `calc(50% + ${y}px)`;
            el.innerText = card.label;
            ring.appendChild(el);
        });
    }

    function isAudio(url) {
        return url.toLowerCase().endsWith('.mp3') || url.toLowerCase().endsWith('.ogg') || url.toLowerCase().endsWith('.wav');
    }

    function loadAndPlay() {
        errorRetryCount = 0;
        const item = masterPlaylist[currentVideoIndex];
        
        player.pause();
        audioPlayer.pause();
        
        player.style.display = 'none';
        audioPlayer.style.display = 'none';
        
        updateTitleDisplay(item.n.trim() + ' [LOADING...]        ');

        if (isAudio(item.u)) {
            audioPlayer.style.display = 'block';
            audioPlayer.src = item.u;
            audioPlayer.load();
            audioPlayer.volume = volumeKnob.value;
            audioPlayer.play().catch(err => {
                console.log("Audio play blocked:", err);
                updateTitleDisplay(item.n.trim() + ' (tap to play)        ');
            });
        } else {
            player.style.display = 'block';
            player.src = item.u;
            player.load();
            player.volume = volumeKnob.value;
            player.play().catch(err => {
                console.log("Video play blocked:", err);
                updateTitleDisplay(item.n.trim() + ' (tap to play)        ');
            });
        }
    }

    function changeVolume(val) {
        player.volume = val;
        audioPlayer.volume = val;
    }

    function tune(dir) {
        tunerDeg += dir * 15; 
        document.getElementById('t-knob').style.transform = `rotate(${tunerDeg}deg)`;
        currentVideoIndex = (currentVideoIndex + dir + masterPlaylist.length) % masterPlaylist.length;
        
        triggerStaticDelay(() => {
            loadAndPlay();
        });
    }

    function toggleFS() {
        const elem = document.getElementById('cabinet');
        if (!document.fullscreenElement) {
            elem.requestFullscreen?.() || elem.webkitRequestFullscreen?.() || elem.mozRequestFullScreen?.() || elem.msRequestFullscreen?.();
        } else {
            document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.mozCancelFullScreen?.() || document.msExitFullscreen?.();
        }
    }

    window.onload = () => {
        makeDialRing('t-ring', 24); // Slash marks and cardinal points
        loadAndPlay();
    };

    function setPlayingTitle() {
        const item = masterPlaylist[currentVideoIndex];
        updateTitleDisplay(item.n.trim() + '          ');
    }

    function setBufferingTitle() {
        if(!titleDisp.innerText.includes("BUFFERING")) {
            const item = masterPlaylist[currentVideoIndex];
            updateTitleDisplay(item.n.trim() + ' [BUFFERING...]        ');
        }
    }

    player.addEventListener('playing', setPlayingTitle);
    audioPlayer.addEventListener('playing', setPlayingTitle);
    player.addEventListener('waiting', setBufferingTitle);
    audioPlayer.addEventListener('waiting', setBufferingTitle);
    
    player.addEventListener('ended', () => tune(1));
    audioPlayer.addEventListener('ended', () => tune(1));

    function handleArchiveError(playerElement) {
        if (errorRetryCount < MAX_RETRIES) {
            errorRetryCount++;
            updateTitleDisplay(`WAKING SERVER... (Try ${errorRetryCount}/${MAX_RETRIES})        `);
            
            setTimeout(() => {
                playerElement.load();
                playerElement.play().catch(e => console.log("Retry blocked:", e));
            }, 4000); 
            
        } else {
            updateTitleDisplay("SERVER TIMEOUT - SKIPPING        ");
            setTimeout(() => tune(1), 2000);
        }
    }

    player.addEventListener('error', () => handleArchiveError(player));
    audioPlayer.addEventListener('error', () => handleArchiveError(audioPlayer));
</script>
</body>
</html>
