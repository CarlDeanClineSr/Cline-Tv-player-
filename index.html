let currentCategoryIndex=0, currentVideoIndex=0, tunerDeg=0, categoryDeg=0;

function playClickSound() {
    if(!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if(!AudioContext) return;
        audioCtx = new AudioContext();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

function playStaticSound() {
    if(!audioCtx) return;
    const n = audioCtx.sampleRate * 0.35;
    const b = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0; i<n; i++) d[i] = Math.random() * 2 - 1;
    const s = audioCtx.createBufferSource();
    const f = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    s.buffer = b; f.type = 'lowpass'; f.frequency.value = 2500;
    g.gain.value = Number(volumeKnob.value) * 0.2;
    s.connect(f); f.connect(g); g.connect(audioCtx.destination);
    s.start();
}

function triggerStaticDelay(cb) {
    player.pause(); audioPlayer.pause();
    player.style.opacity = '0'; audioPlayer.style.opacity = '0'; audioStage.style.opacity = '0';
    document.getElementById('static-overlay').classList.add('active');
    playStaticSound();
    setTimeout(() => {
        document.getElementById('static-overlay').classList.remove('active');
        player.style.opacity = '1'; audioPlayer.style.opacity = '1'; audioStage.style.opacity = '1';
        cb();
    }, 350);
}

function updateTitleDisplay(text) {
    const o = document.getElementById('osd');
    const c = categories[currentCategoryIndex];
    const clean = text.replace(/\[LOADING\.\.\.\]\s*|\[BUFFERING\.\.\.\]\s*|\(tap to play\)\s*/g,'').trim();
    const pos = c && c.content && c.content.length ? (currentVideoIndex % c.content.length) + 1 : 0;
    const h = `CH ${c.name} • ${c.label} • ${pos}/${c.content.length}`;
    o.innerHTML = (text.includes('WAKING SERVER') || text.includes('TIMEOUT')) ? `${h}<br>${text.trim()}` : `${h}<br>${clean}`;
    o.style.opacity = '1';
    clearTimeout(osdTimeout);
    if(!text.includes('WAKING SERVER') && !text.includes('TIMEOUT')) {
        osdTimeout = setTimeout(() => o.style.opacity = '0', 3500);
    }
}

function makeTicks(id, count) {
    const r = document.getElementById(id);
    r.innerHTML = '';
    const rad = 60;
    const step = 360 / count;
    for(let i=0; i<count; i++){
        const t = document.createElement('div');
        t.className = 'tick';
        t.style.transform = `translate(-50%,-50%) rotate(${i*step}deg) translateY(-${rad}px)`;
        r.appendChild(t);
    }
}

function makeChannelLabels(id, cs) {
    const r = document.getElementById(id);
    r.innerHTML = '';
    const count = cs.length;
    const rad = 54; // Tight fit hugging the 60px knob within the 140px housing
    const step = 360 / count;
    for(let i=0; i<count; i++){
        const a = i * step - 90;
        const z = a * Math.PI / 180;
        const n = document.createElement('div');
        n.className = 'number';
        n.style.left = `calc(50% + ${rad*Math.cos(z)}px)`;
        n.style.top = `calc(50% + ${rad*Math.sin(z)}px)`;
        n.innerText = i + 1; // Renders 1 through 10
        r.appendChild(n);
    }
}

const AUDIO_EXTENSIONS = ['.mp3','.m4a','.aac','.ogg','.oga','.wav','.flac','.opus'];
function isAudio(url) {
    const p = String(url).split(/[?#]/,1)[0].toLowerCase();
    return AUDIO_EXTENSIONS.some(x => p.endsWith(x));
}

function seededRandom(seed){let v=seed>>>0;return()=>{v=(1664525*v+1013904223)>>>0;return v/4294967296}}
function hashText(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function buildRadioStars(title){const rnd=seededRandom(hashText(title||'CLINE RADIO'));radioStars=[];for(let i=0;i<90;i++)radioStars.push({x:rnd(),y:rnd(),size:.45+rnd()*1.6,phase:rnd()*Math.PI*2,drift:.25+rnd()*.75})}
function resizeAudioScope(){const r=audioScope.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.floor(r.width*d)),h=Math.max(1,Math.floor(r.height*d));if(audioScope.width!==w||audioScope.height!==h){audioScope.width=w;audioScope.height=h}return{width:w,height:h,dpr:d}}
function drawAudioScope(){if(!audioStage.classList.contains('active')){audioScopeFrame=null;return}const c=audioScope.getContext('2d'),{width:w,height:h,dpr:d}=resizeAudioScope(),t=Number.isFinite(audioPlayer.currentTime)?audioPlayer.currentTime:0,m=(!audioPlayer.paused&&!audioPlayer.ended)?1:.08,now=performance.now()/1000;c.clearRect(0,0,w,h);for(const s of radioStars){const tw=.32+.68*Math.abs(Math.sin(now*s.drift+s.phase));c.beginPath();c.fillStyle=`rgba(170,255,220,${.15+tw*.55})`;c.arc(s.x*w,((s.y+now*s.drift*.0015)%1)*h,s.size*d,0,Math.PI*2);c.fill()}const cx=w/2,cy=h*.5,span=w*.37,bars=48,bw=Math.max(1.2*d,span/bars*.55);c.strokeStyle='rgba(0,255,120,.20)';c.lineWidth=Math.max(1,d);c.beginPath();c.moveTo(cx-span,cy);c.lineTo(cx+span,cy);c.stroke();for(let i=0;i<bars;i++){const q=i/(bars-1),voice=Math.abs(Math.sin(t*6.2+i*.73))*.46+Math.abs(Math.sin(t*2.3+i*.31))*.29+Math.abs(Math.sin(t*11.7+i*1.07))*.25,env=.4+.6*Math.abs(Math.sin(t*.91+i*.04)),edge=Math.pow(Math.sin(q*Math.PI),.42),amp=h*.22*edge*(.1+m*voice*env),x=(i+.5)*(span/bars),a=.3+.6*edge;c.fillStyle=`rgba(0,255,120,${a})`;c.fillRect(cx+x,cy-amp,bw,amp*2);c.fillRect(cx-x-bw,cy-amp,bw,amp*2)}const p=(.5+.5*Math.sin(t*3.4))*m;c.strokeStyle=`rgba(0,255,150,${.22+p*.42})`;c.lineWidth=Math.max(1.2*d,2);c.beginPath();c.arc(cx,cy,(24+p*34)*d,0,Math.PI*2);c.stroke();audioScopeFrame=requestAnimationFrame(drawAudioScope)}
function startAudioScope(item){buildRadioStars(item.n);audioStage.classList.add('active');if(audioScopeFrame===null)audioScopeFrame=requestAnimationFrame(drawAudioScope)}
function stopAudioScope(){audioStage.classList.remove('active');if(audioScopeFrame!==null){cancelAnimationFrame(audioScopeFrame);audioScopeFrame=null}}

window.addEventListener('resize',()=>{if(audioStage.classList.contains('active'))resizeAudioScope()});

function loadAndPlay() {
    errorRetryCount = 0;
    const c = categories[currentCategoryIndex];
    if(!c || !Array.isArray(c.content) || !c.content.length) {
        updateTitleDisplay('CHANNEL OFFLINE'); return;
    }
    const item = c.content[currentVideoIndex % c.content.length];
    player.pause(); audioPlayer.pause();
    player.removeAttribute('src'); audioPlayer.removeAttribute('src');
    player.style.display = 'none'; audioPlayer.style.display = 'none';
    
    updateTitleDisplay(item.n.trim() + ' [LOADING...]');
    
    if(isAudio(item.u)) {
        audioPlayer.style.display = 'block';
        startAudioScope(item);
        audioPlayer.src = item.u;
        audioPlayer.load();
        audioPlayer.volume = Number(volumeKnob.value);
        audioPlayer.play().catch(e => {
            console.log('Audio play blocked:', e);
            updateTitleDisplay(item.n.trim() + ' (tap to play)');
        });
    } else {
        stopAudioScope();
        player.style.display = 'block';
        player.src = item.u;
        player.load();
        player.volume = Number(volumeKnob.value);
        player.play().catch(e => {
            console.log('Video play blocked:', e);
            updateTitleDisplay(item.n.trim() + ' (tap to play)');
        });
    }
}

function changeVolume(v) {
    v = Number(v); player.volume = v; audioPlayer.volume = v;
}

function tune(dir, auto=false) {
    playClickSound();
    tunerDeg += dir * 3.6;
    document.getElementById('t-knob').style.transform = `rotate(${tunerDeg}deg)`;
    const c = categories[currentCategoryIndex];
    if(!c || !c.content.length) return;
    if(auto && dir > 0 && (currentVideoIndex + 1) >= c.content.length) {
        changeCategory(1); return;
    }
    currentVideoIndex = (currentVideoIndex + dir + c.content.length) % c.content.length;
    triggerStaticDelay(loadAndPlay);
}

function changeCategory(dir) {
    playClickSound();
    categoryDeg += dir * (360 / categories.length);
    document.getElementById('s-knob').style.transform = `rotate(${categoryDeg}deg)`;
    currentCategoryIndex = (currentCategoryIndex + dir + categories.length) % categories.length;
    currentVideoIndex = 0;
    triggerStaticDelay(loadAndPlay);
}

function toggleFS() {
    const e = document.getElementById('cabinet');
    if(!document.fullscreenElement) {
        e.requestFullscreen?.() || e.webkitRequestFullscreen?.() || e.mozRequestFullScreen?.() || e.msRequestFullscreen?.();
    } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.() || document.mozCancelFullScreen?.() || document.msExitFullscreen?.();
    }
}

function setPlayingTitle() {
    const c = categories[currentCategoryIndex], i = c.content[currentVideoIndex % c.content.length];
    updateTitleDisplay(i.n.trim());
}

function setBufferingTitle() {
    const c = categories[currentCategoryIndex], i = c.content[currentVideoIndex % c.content.length];
    updateTitleDisplay(i.n.trim() + ' [BUFFERING...]');
}

function handleArchiveError(el) {
    if(errorRetryCount < MAX_RETRIES) {
        errorRetryCount++;
        updateTitleDisplay(`WAKING SERVER... (Try ${errorRetryCount}/${MAX_RETRIES})`);
        setTimeout(() => {
            el.load(); el.play().catch(e => console.log('Retry blocked:', e));
        }, 4000);
    } else {
        updateTitleDisplay('SERVER TIMEOUT - SKIPPING');
        setTimeout(() => tune(1, true), 2000);
    }
}

player.addEventListener('error', () => handleArchiveError(player));
audioPlayer.addEventListener('error', () => handleArchiveError(audioPlayer));

window.onload = () => {
    makeTicks('t-ring', 100);
    makeChannelLabels('s-ring', categories);
    loadAndPlay();
};
</script>
</body>
