<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>CLINE CLASSIC TV</title>
  <style>
    :root{
      --bg:#070707;
      --panel:#1a1a1a;
      --panel2:#2b2b2b;
      --trim:#0f0f0f;
      --text:#ececec;
      --accent:#ff7a18;
      --muted:#9e9e9e;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      background:#000;
      color:var(--text);
      font-family:"Courier New", monospace;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .app{
      width:min(96vw,1280px);
      height:min(94vh,920px);
      background:linear-gradient(180deg,#101010,#080808);
      border:22px solid #050505;
      border-radius:28px;
      box-shadow:
        0 40px 100px rgba(0,0,0,.85),
        inset 0 0 120px rgba(0,0,0,.8);
      padding:24px;
      position:relative;
      display:flex;
      gap:22px;
    }

    .screen-wrap{
      flex:1 1 auto;
      min-width:0;
      background:#000;
      border:16px solid #1d1d1d;
      border-radius:18px;
      box-shadow:inset 0 0 80px rgba(0,0,0,.95);
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .screen-wrap::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.04), rgba(255,255,255,0) 18%, rgba(255,255,255,.02) 50%, rgba(0,0,0,.08)),
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.02) 0px,
          rgba(255,255,255,.02) 1px,
          rgba(0,0,0,0) 3px,
          rgba(0,0,0,0) 4px
        );
      mix-blend-mode:screen;
    }

    video,
    audio{
      width:100%;
      height:100%;
      background:#000;
    }

    video{
      object-fit:contain;
    }

    audio{
      width:92%;
      height:64px;
      display:none;
      filter:invert(.88) contrast(.9);
    }

    .side{
      width:min(320px,28%);
      min-width:250px;
      background:linear-gradient(180deg,#4d4d4d,#2c2c2c);
      border:10px solid #101010;
      border-radius:14px;
      box-shadow:inset 0 0 40px rgba(0,0,0,.8);
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .brand{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      font-size:12px;
      color:var(--accent);
      font-weight:bold;
    }

    .title-box{
      background:repeating-linear-gradient(
        45deg,
        #232323,
        #232323 5px,
        #1a1a1a 5px,
        #1a1a1a 12px
      );
      border:7px solid #101010;
      border-radius:10px;
      min-height:62px;
      padding:10px 12px;
      overflow:hidden;
      display:flex;
      align-items:center;
    }

    .title{
      width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-transform:uppercase;
      font-weight:bold;
      font-size:14px;
      text-shadow:0 0 5px #000;
    }

    .marquee{
      display:inline-block;
      padding-right:48px;
      animation:marquee 22s linear infinite;
    }

    @keyframes marquee{
      from{transform:translateX(0)}
      to{transform:translateX(-100%)}
    }

    .section{
      background:rgba(0,0,0,.22);
      border:2px solid rgba(255,255,255,.06);
      border-radius:10px;
      padding:12px;
    }

    .label{
      font-size:12px;
      color:#ddd;
      margin-bottom:8px;
      text-transform:uppercase;
    }

    .row{
      display:flex;
      gap:8px;
      align-items:center;
    }

    button,
    select,
    input[type="range"]{
      font-family:inherit;
    }

    button,
    select{
      background:#111;
      color:#f2f2f2;
      border:1px solid #444;
      border-radius:8px;
      padding:10px 12px;
      cursor:pointer;
    }

    button:hover,
    select:hover{
      border-color:#777;
    }

    .big-btn{
      width:100%;
      font-weight:bold;
    }

    .dual{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .small{
      font-size:12px;
      color:var(--muted);
      line-height:1.45;
    }

    .status{
      font-size:12px;
      color:#cfcfcf;
      min-height:18px;
    }

    .volume{
      width:100%;
    }

    .channel-list{
      width:100%;
      max-height:180px;
      background:#101010;
      color:#f2f2f2;
      border:1px solid #3d3d3d;
      border-radius:8px;
      padding:8px;
    }

    .top-actions{
      position:absolute;
      top:16px;
      left:16px;
      right:16px;
      display:flex;
      justify-content:space-between;
      pointer-events:none;
    }

    .floating{
      pointer-events:auto;
      background:#101010;
      color:#fff;
      border:1px solid #444;
      border-radius:8px;
      padding:8px 12px;
      font-size:12px;
      font-weight:bold;
      cursor:pointer;
    }

    @media (max-width: 900px){
      .app{
        flex-direction:column;
        height:auto;
        min-height:100vh;
        border-width:14px;
        border-radius:0;
        width:100vw;
      }

      .screen-wrap{
        min-height:50vh;
      }

      .side{
        width:100%;
        min-width:0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-actions">
      <button class="floating" id="fsBtn">FULL SCREEN</button>
      <div class="floating" id="versionTag">4:3 EDITION</div>
    </div>

    <div class="screen-wrap" id="screenWrap">
      <video id="videoPlayer" controls autoplay playsinline webkit-playsinline></video>
      <audio id="audioPlayer" controls></audio>
    </div>

    <aside class="side">
      <div class="brand">
        <div>CLINE CLASSIC TV</div>
        <div>V2</div>
      </div>

      <div class="title-box">
        <div class="title" id="titleDisplay">STANDBY</div>
      </div>

      <div class="section">
        <div class="label">Category</div>
        <div class="row">
          <select id="categorySelect" class="big-btn"></select>
        </div>
      </div>

      <div class="section">
        <div class="label">Channel</div>
        <select id="channelSelect" class="channel-list" size="8"></select>
      </div>

      <div class="section">
        <div class="label">Controls</div>
        <div class="dual">
          <button id="prevBtn">PREV</button>
          <button id="nextBtn">NEXT</button>
          <button id="playBtn">PLAY</button>
          <button id="reloadBtn">RELOAD</button>
        </div>
      </div>

      <div class="section">
        <div class="label">Volume</div>
        <input id="volumeSlider" class="volume" type="range" min="0" max="1" step="0.01" value="0.7" />
      </div>

      <div class="section">
        <div class="label">Status</div>
        <div class="status" id="statusText">Ready.</div>
        <div class="small">
          Audio/video auto-detects by file extension.<br />
          If playback is blocked, press PLAY.
        </div>
      </div>
    </aside>
  </div>

  <script>
    const categories = [
      {
        name: "A",
        items: [
          { n: "A. Einstein", u: "https://archive.org/download/NOVAAEinstein/NOVA.S06E09.A.Einstein.VHSRip.AAC2.0.x264-RATTERA.mp4" },
          { n: "NASA UFO Footages", u: "https://archive.org/download/NASAfootages/UFOs.avi" },
          { n: "Pink Panther: Olympinks", u: "https://archive.org/download/ThePinkPanther-cartoons/The Pink Panther in -OLYMPINKS!.mp4" },
          { n: "Unacknowledged", u: "https://ia601407.us.archive.org/8/items/unacknowledged.-2017.308p/Unacknowledged%20%282017%29/Unacknowledged.2017.308p.mp4" }
        ]
      },
      {
        name: "B",
        items: [
          { n: "Arthur C Clarkes World of Strange Powers - From Mind to Mind", u: "https://archive.org/download/arthur-c-clarkes-world-of-strange-powers-complete-series-1985/Arthur C Clarkes - World of Strange Powers S01E03 - From Mind to Mind.mp4" },
          { n: "Project UFO S01E01 - The Washington DC Incident", u: "https://archive.org/download/Project-UFO-1978-Series/Project%20UFO%20%2826%20of%2026%29/S01E01%20-%20Sighting%204001%20-%20The%20Washington%20DC%20Incident.mp4" },
          { n: "Project UFO S01E02 - The Joshua Flats Incident", u: "https://archive.org/download/Project-UFO-1978-Series/Project%20UFO%20%2826%20of%2026%29/S01E02%20-%20Sighting%204002%20-%20The%20Joshua%20Flats%20Incident.mp4" }
        ]
      },
      {
        name: "C",
        items: [
          { n: "Plymouth Fury 1968 Ad", u: "https://archive.org/download/classic-car-commercials/Plymouth_Fury_1968.mp4" },
          { n: "Dodge Charger 1969 Commercial", u: "https://archive.org/download/classic-car-commercials/Dodge_Charger_1969.mp4" },
          { n: "Arthur C Clarke | Fractals | The Colors Of Infinity", u: "https://archive.org/download/youtube-IptmGRQiZg0/IptmGRQiZg0.mp4" }
        ]
      },
      {
        name: "J",
        items: [
          { n: "A Christmas Carol", u: "https://archive.org/download/AChristmasCarolCbsRadioMysteryTheater/Cbsrmt7512240402AChristmasCarol_wbbm_rec12_24_78.mp3" },
          { n: "CBSRMT - 1974 Cold Storage", u: "https://archive.org/download/CBSRMT/CBSRMT_740113__44m18s__Cold_Storage.mp3" },
          { n: "TREASURE ISLAND FULL Audio Book", u: "https://archive.org/download/TREASUREISLANDFULLAudioBookByRobertLouisStevensonAdventurePirateFiction/TREASURE ISLAND - FULL AudioBook by Robert Louis Stevenson - Adventure - Pirate Fiction.ogv" }
        ]
      }
    ];

    const videoPlayer = document.getElementById("videoPlayer");
    const audioPlayer = document.getElementById("audioPlayer");
    const titleDisplay = document.getElementById("titleDisplay");
    const statusText = document.getElementById("statusText");
    const categorySelect = document.getElementById("categorySelect");
    const channelSelect = document.getElementById("channelSelect");
    const volumeSlider = document.getElementById("volumeSlider");

    let currentCategoryIndex = 0;
    let currentItemIndex = 0;

    function isAudio(url) {
      const u = url.toLowerCase();
      return u.endsWith(".mp3") || u.endsWith(".ogg") || u.endsWith(".wav") || u.endsWith(".m4a");
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function updateTitle(text) {
      titleDisplay.classList.remove("marquee");
      titleDisplay.textContent = text;
      requestAnimationFrame(() => {
        if (titleDisplay.scrollWidth > titleDisplay.clientWidth) {
          titleDisplay.classList.add("marquee");
        }
      });
    }

    function populateCategories() {
      categorySelect.innerHTML = "";
      categories.forEach((cat, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${cat.name} (${cat.items.length})`;
        categorySelect.appendChild(opt);
      });
      categorySelect.value = currentCategoryIndex;
    }

    function populateChannels() {
      channelSelect.innerHTML = "";
      const items = categories[currentCategoryIndex].items;
      items.forEach((item, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${i + 1}. ${item.n}`;
        channelSelect.appendChild(opt);
      });
      channelSelect.value = currentItemIndex;
    }

    function stopPlayers() {
      videoPlayer.pause();
      audioPlayer.pause();
      videoPlayer.removeAttribute("src");
      audioPlayer.removeAttribute("src");
      videoPlayer.load();
      audioPlayer.load();
      videoPlayer.style.display = "none";
      audioPlayer.style.display = "none";
    }

    function playCurrent() {
      const item = categories[currentCategoryIndex].items[currentItemIndex];
      if (!item) return;

      stopPlayers();
      updateTitle(item.n);
      setStatus(`Loading: ${item.n}`);

      if (isAudio(item.u)) {
        audioPlayer.style.display = "block";
        audioPlayer.src = item.u;
        audioPlayer.volume = volumeSlider.value;
        audioPlayer.load();
        audioPlayer.play()
          .then(() => setStatus("Audio playing."))
          .catch(() => setStatus("Playback blocked. Press PLAY."));
      } else {
        videoPlayer.style.display = "block";
        videoPlayer.src = item.u;
        videoPlayer.volume = volumeSlider.value;
        videoPlayer.load();
        videoPlayer.play()
          .then(() => setStatus("Video playing."))
          .catch(() => setStatus("Playback blocked. Press PLAY."));
      }

      categorySelect.value = currentCategoryIndex;
      channelSelect.value = currentItemIndex;
    }

    function nextChannel() {
      const items = categories[currentCategoryIndex].items;
      currentItemIndex = (currentItemIndex + 1) % items.length;
      playCurrent();
    }

    function prevChannel() {
      const items = categories[currentCategoryIndex].items;
      currentItemIndex = (currentItemIndex - 1 + items.length) % items.length;
      playCurrent();
    }

    function reloadCurrent() {
      playCurrent();
    }

    function changeCategory(index) {
      currentCategoryIndex = Number(index);
      currentItemIndex = 0;
      populateChannels();
      playCurrent();
    }

    function changeChannel(index) {
      currentItemIndex = Number(index);
      playCurrent();
    }

    document.getElementById("nextBtn").addEventListener("click", nextChannel);
    document.getElementById("prevBtn").addEventListener("click", prevChannel);
    document.getElementById("reloadBtn").addEventListener("click", reloadCurrent);
    document.getElementById("playBtn").addEventListener("click", () => {
      if (videoPlayer.style.display !== "none" && videoPlayer.src) {
        videoPlayer.play().catch(() => {});
      }
      if (audioPlayer.style.display !== "none" && audioPlayer.src) {
        audioPlayer.play().catch(() => {});
      }
    });

    categorySelect.addEventListener("change", e => changeCategory(e.target.value));
    channelSelect.addEventListener("change", e => changeChannel(e.target.value));
    volumeSlider.addEventListener("input", e => {
      videoPlayer.volume = e.target.value;
      audioPlayer.volume = e.target.value;
    });

    document.getElementById("fsBtn").addEventListener("click", async () => {
      const el = document.querySelector(".app");
      if (!document.fullscreenElement) {
        await el.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    });

    videoPlayer.addEventListener("ended", nextChannel);
    audioPlayer.addEventListener("ended", nextChannel);

    videoPlayer.addEventListener("error", () => {
      setStatus("Video error. Skipping to next.");
      setTimeout(nextChannel, 1200);
    });

    audioPlayer.addEventListener("error", () => {
      setStatus("Audio error. Skipping to next.");
      setTimeout(nextChannel, 1200);
    });

    populateCategories();
    populateChannels();
    playCurrent();
  </script>
</body>
</html>
