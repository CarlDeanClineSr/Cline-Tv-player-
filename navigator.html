<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPERIAL PHYSICS OBSERVATORY | LIVE STELLAR NAVIGATOR</title>
    <style>
        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            box-sizing: border-box;
        }
        .console-box {
            width: min(94vw, 850px);
            background: #0f0f0f;
            border: 6px solid #222;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        h1 {
            font-size: 16px;
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 8px rgba(255,102,0,0.4);
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            justify-content: center;
        }
        input[type="number"] {
            background: #000;
            border: 2px solid #444;
            color: #00ff66;
            padding: 12px;
            font-size: 20px;
            font-family: monospace;
            width: 220px;
            border-radius: 6px;
            text-align: center;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        input[type="number"]:focus {
            border-color: #00ff66;
        }
        button {
            background: #ff6600;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        button:hover {
            background: #ff8833;
        }
        .telemetry-screen {
            background: #000;
            border: 2px solid #1a1a1a;
            border-radius: 8px;
            padding: 24px;
            min-height: 220px;
            font-family: monospace;
            box-shadow: inset 0 0 20px rgba(0,255,102,0.05);
        }
        .data-row {
            margin: 10px 0;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #151515;
            padding-bottom: 6px;
        }
        .data-label { color: #777; }
        .data-value { color: #00ff66; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,102,0.3); }
        .external-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: #3399ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .external-link:hover { text-decoration: underline; color: #66b2ff; }
        .status-msg {
            color: #666;
            text-align: center;
            padding-top: 70px;
            font-style: italic;
        }

        * { box-sizing: border-box; }
        body { height: auto; min-height: 100dvh; overflow: auto; padding: 16px; justify-content: flex-start; }
        .console-box { width: min(100%,850px); padding: clamp(16px,4vw,30px); }
        .site-nav { width: min(100%,850px); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; font-size: 14px; }
        .site-nav strong { margin-right: auto; color: #ff8833; }
        .site-nav a { color: #eee; border: 1px solid #777; padding: 12px; border-radius: 6px; text-decoration: none; }
        .input-group { flex-wrap: wrap; align-items: end; }
        .input-group label { display: grid; gap: 8px; font-size: 14px; }
        input[type=number] { max-width: 100%; }
        .data-row { gap: 16px; flex-wrap: wrap; line-height: 1.6; }
        .data-value { overflow-wrap: anywhere; }
        .data-label { color: #aaa; }
        .external-link { line-height: 1.6; letter-spacing: 0; }
        .status-msg { color: #bbb; line-height: 1.6; padding: 24px 0; }
        button { min-height: 44px; }
        :focus-visible { outline: 3px solid #00ff66; outline-offset: 3px; }
        #node-share { width: 100%; background: #050505; color: #eee; border: 1px solid #777; padding: 12px; margin: 12px 0; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>

<nav class="site-nav" aria-label="Site navigation"><strong>IMPERIAL PHYSICS OBSERVATORY</strong><a href="index.html">TV</a><a href="navigator.html" aria-current="page">Stellar navigator</a></nav>
<main class="console-box">
    <h1>Stellar Index Navigator</h1>
    <form class="input-group" id="lookup-form">
        <label for="nodeInput">Node number<input type="number" id="nodeInput" placeholder="1–100000" min="1" step="1" required></label>
        <button type="submit">ACQUIRE</button>
    </form>
    <div class="telemetry-screen" id="telemetryScreen" aria-live="polite"><div class="status-msg">Enter a node number to load its record.</div></div>
    <div id="share-controls" hidden><button id="share-node" type="button">Share this target</button><label for="node-share" id="share-label" hidden>Target link</label><input id="node-share" readonly hidden><p id="share-message" role="status"></p></div>
</main>
<script>
const screen=document.getElementById('telemetryScreen');
let manifest=null, requestNumber=0, currentNode=null, pending=null;
const chunkCache=new Map();
function message(text){const p=document.createElement('p');p.className='status-msg';p.textContent=text;screen.replaceChildren(p);}
function normaliseNode(n){return{id:n.i??n.id,tier:n.t??n.tier,dist_pc:n.d??n.dist_pc,dist_ly:n.l??n.dist_ly,ra:n.r??n.ra,dec:n.e??n.dec,harmonic:n.h??n.harmonic,visual_url:n.u??n.visual_url};}
async function getJSON(path,signal){const response=await fetch(path,{signal});if(!response.ok)throw new Error('Source unavailable');return response.json();}
async function lookupNode(){
    const raw=document.getElementById('nodeInput').value.trim(),id=Number(raw);
    const token=++requestNumber;
    if(pending)pending.abort();pending=new AbortController();
    currentNode=null;document.getElementById('share-controls').hidden=true;
    if(!/^\d+$/.test(raw)||!Number.isSafeInteger(id)||id<1){message('Enter a whole node number of 1 or greater.');return;}
    message(`Loading target #${id}…`);
    try{
        if(!manifest){const m=await getJSON('nodes/manifest.json',pending.signal);if(token!==requestNumber)return;if(!Number.isInteger(m.chunkSize)||m.chunkSize<1||!Number.isInteger(m.maxId)||!Array.isArray(m.chunks))throw new Error('Invalid registry index');manifest=m;document.getElementById('nodeInput').max=String(m.maxId);}
        if(id>manifest.maxId){message(`Enter a node number from 1 to ${manifest.maxId}.`);return;}
        const bucket=Math.floor((id-1)/manifest.chunkSize);
        if(!manifest.chunks.includes(bucket)){message(`Target #${id} is not in this registry.`);return;}
        let data=chunkCache.get(bucket);
        if(!data){data=await getJSON(`nodes/${bucket}.json`,pending.signal);if(token!==requestNumber)return;chunkCache.set(bucket,data);if(chunkCache.size>4)chunkCache.delete(chunkCache.keys().next().value);}
        if(token!==requestNumber)return;
        if(!data[String(id)]){message(`Target #${id} is not in this registry.`);return;}
        const node=normaliseNode(data[String(id)]);screen.replaceChildren();
        const fields=[['TARGET ID',node.id],['SHELL TIER',node.tier],['DISTANCE (pc)',node.dist_pc],['DISTANCE (ly)',node.dist_ly],['RIGHT ASCENSION (°)',node.ra],['DECLINATION (°)',node.dec],['HARMONIC SIGNATURE',node.harmonic]];
        fields.forEach(([label,value])=>{const row=document.createElement('div');row.className='data-row';const k=document.createElement('span');k.className='data-label';k.textContent=label;const v=document.createElement('span');v.className='data-value';v.textContent=value??'Not supplied';row.append(k,v);screen.appendChild(row);});
        // Follow only the URL stored in the record; never construct a guessed destination.
        try{const url=new URL(node.visual_url);if(url.protocol==='https:'||url.protocol==='http:'){const link=document.createElement('a');link.className='external-link';link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open target in sky viewer';screen.appendChild(link);}}catch{}
        currentNode=id;const url=new URL(location.href);url.hash=new URLSearchParams({node:String(id)}).toString();history.replaceState(null,'',url.href);
        document.getElementById('share-controls').hidden=false;document.getElementById('node-share').hidden=true;document.getElementById('share-label').hidden=true;document.getElementById('share-message').textContent='';
        try{localStorage.setItem('cline-last-node',String(id));}catch{}
    }catch(e){if(token!==requestNumber||e.name==='AbortError')return;message('Unable to load this registry section. Press ACQUIRE to retry.');}
}
function restoreTarget(){const p=new URLSearchParams(location.hash.slice(1));let value=p.get('node');if(!value){try{value=localStorage.getItem('cline-last-node');}catch{}}if(value){document.getElementById('nodeInput').value=value;lookupNode();}}
document.getElementById('lookup-form').addEventListener('submit',e=>{e.preventDefault();lookupNode();});
document.getElementById('share-node').addEventListener('click',async()=>{if(currentNode===null)return;const input=document.getElementById('node-share');input.value=location.href;input.hidden=false;document.getElementById('share-label').hidden=false;try{await navigator.clipboard.writeText(input.value);document.getElementById('share-message').textContent='Target link copied.';}catch{input.focus();input.select();document.getElementById('share-message').textContent='Select and copy the target link.';}});
window.addEventListener('hashchange',restoreTarget);restoreTarget();
</script>
</body>
</html>
